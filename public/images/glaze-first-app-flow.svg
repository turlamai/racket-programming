<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 620" role="img" aria-labelledby="t d"><title id="t">Glaze 的按钮事件与后端调用</title><desc id="d">用户输入 Ada 并点击按钮，JavaScript 调用生成的 greet API，Racket 校验字符串并返回 message，页面以纯文本显示问候。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#A8532D"/></marker></defs><rect width="680" height="620" rx="12" fill="#FAF9F6"/><g font-family="Inter, PingFang SC, Microsoft YaHei, system-ui, sans-serif" fill="#2A2820" text-anchor="middle"><text x="340" y="40" font-size="25" font-weight="bold">Glaze：从点击到显示结果</text><rect x="35" y="75" width="610" height="130" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="340" y="106" font-size="20" font-weight="bold">原生 WebView · HTML / CSS / JavaScript</text><rect x="75" y="128" width="350" height="46" rx="6" fill="#FAF9F6" stroke="#C8C3B8"/><text x="250" y="157" font-size="22">Ada</text><rect x="440" y="128" width="165" height="46" rx="6" fill="#A8532D"/><text x="522" y="157" font-size="20" fill="#FFFFFF">打招呼</text><path d="M340 205V236" stroke="#A8532D" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="242" width="610" height="70" rx="8" fill="#EBE8E0" stroke="#878278"/><text x="340" y="269" font-size="20" font-weight="bold">生成的客户端 API</text><text x="340" y="296" font-size="20">glaze.api.greet({name: "Ada"})</text><path d="M340 312V345" stroke="#A8532D" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="351" width="610" height="85" rx="8" fill="#FFE4D6" stroke="#878278"/><text x="340" y="382" font-size="22" font-weight="bold">Racket 后端：greet</text><text x="340" y="412" font-size="19">GString 参数校验 → 生成 message 字段</text><path d="M340 436V470" stroke="#A8532D" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="476" width="610" height="84" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="340" y="506" font-size="19">JavaScript 更新 textContent</text><text x="340" y="539" font-size="24" font-weight="bold" fill="#A8532D">你好，Ada！</text><text x="340" y="595" font-size="17">逻辑调用路径示意，非实际窗口截图。</text></g></svg>