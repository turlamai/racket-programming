<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" role="img" aria-labelledby="t d"><title id="t">一个列表与多个返回值</title><desc id="d">列表是单个值，values返回多个值，接收位置需匹配结果数量。</desc><rect width="680" height="470" rx="12" fill="#FAF9F6"/><g font-family="Inter, PingFang SC, Microsoft YaHei, system-ui, sans-serif" text-anchor="middle" fill="#2A2820"><text x="340" y="38" font-size="25" font-weight="bold">一个列表与多个返回值</text><rect x="40" y="65" width="600" height="100" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="340" y="100" font-size="22" font-weight="bold">单个聚合值</text><text x="340" y="135" font-size="21">(list 10 20) → '(10 20)</text><path d="M340 165v20m-5 -8l5 8 5 -8" fill="none" stroke="#A8532D" stroke-width="2"/><rect x="40" y="190" width="600" height="100" rx="8" fill="#FFE4D6" stroke="#878278"/><text x="340" y="225" font-size="22" font-weight="bold">两个独立结果</text><text x="340" y="260" font-size="21">(values 10 20) → 10 和 20</text><path d="M340 290v20m-5 -8l5 8 5 -8" fill="none" stroke="#A8532D" stroke-width="2"/><rect x="40" y="315" width="600" height="100" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="340" y="350" font-size="22" font-weight="bold">对应的接收形式</text><text x="340" y="385" font-size="16">(let-values ([(x y) (values 10 20)]) (+ x y)) → 30</text></g></svg>