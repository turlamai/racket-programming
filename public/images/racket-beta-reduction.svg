<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 600" role="img" aria-labelledby="t d"><title id="t">β 归约与避免变量捕获</title><desc id="d">普通代入将自由出现的变量替换为实参。若内部同名绑定会捕获实参自由变量，先进行α改名。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#A8532D"/></marker></defs><rect width="680" height="600" rx="12" fill="#FAF9F6"/><g font-family="Inter, PingFang SC, Microsoft YaHei, system-ui, sans-serif" fill="#2A2820"><text x="340" y="40" text-anchor="middle" font-size="25" font-weight="bold">β 归约：把参数代入函数体</text><rect x="30" y="70" width="620" height="72" rx="8" fill="#EBE8E0" stroke="#878278" stroke-width="1.5"/><text x="340" y="100" text-anchor="middle" font-size="25">(λx. λy. x) A B</text><text x="340" y="127" text-anchor="middle" font-size="18">先把 A 代入外层函数体</text><path d="M340 142V172" fill="none" stroke="#A8532D" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="176" width="620" height="63" rx="8" fill="#EBE8E0" stroke="#878278" stroke-width="1.5"/><text x="340" y="215" text-anchor="middle" font-size="25" font-weight="bold">(λy. A) B → A</text><text x="340" y="288" text-anchor="middle" font-size="22" font-weight="bold">遇到同名绑定时，先避免捕获</text><rect x="30" y="307" width="620" height="60" rx="8" fill="#EBE8E0" stroke="#878278" stroke-width="1.5"/><text x="340" y="344" text-anchor="middle" font-size="25">(λx. λy. x) y</text><path d="M340 367V395" fill="none" stroke="#A8532D" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="400" width="620" height="72" rx="8" fill="#FFE4D6" stroke="#878278" stroke-width="1.5"/><text x="340" y="429" text-anchor="middle" font-size="24">α 改名： (λx. λz. x) y</text><text x="340" y="455" text-anchor="middle" font-size="18">内层 y 改为新的名字 z</text><path d="M340 472V500" fill="none" stroke="#A8532D" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="505" width="620" height="58" rx="8" fill="#FFE4D6" stroke="#878278" stroke-width="1.5"/><text x="340" y="541" text-anchor="middle" font-size="25" font-weight="bold">β 归约： λz. y</text><text x="340" y="585" text-anchor="middle" font-size="19">自由的 y 仍然自由，没有变成内部参数。</text></g></svg>