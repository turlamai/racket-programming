<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" role="img" aria-labelledby="t d"><title id="t">点对与列表</title><desc id="d">普通点对的 cdr 为 2；列表由三个点对连接，最后的 cdr 为空表。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs><rect width="680" height="520" rx="16" fill="#f8fafc"/><g font-family="sans-serif" fill="#172554"><text x="340" y="40" text-anchor="middle" font-size="26" font-weight="bold">从点对到列表</text><text x="340" y="83" text-anchor="middle" font-size="23" font-weight="bold">① (cons 1 2)</text><rect x="288" y="107" width="104" height="60" rx="8" fill="#ccfbf1" stroke="#64748b" stroke-width="1.5"/><path d="M340 107v60" fill="none" stroke="#475569" stroke-width="2"/><text x="314" y="145" text-anchor="middle" font-size="24">1</text><text x="366" y="145" text-anchor="middle" font-size="24">2</text><text x="314" y="190" text-anchor="middle" font-size="18">car</text><text x="366" y="190" text-anchor="middle" font-size="18">cdr</text><text x="340" y="224" text-anchor="middle" font-size="19">右边是数字 2，因此不是列表。</text><text x="340" y="272" text-anchor="middle" font-size="23" font-weight="bold">② (list 1 2 3)</text><rect x="28" y="305" width="104" height="60" rx="8" fill="#ccfbf1" stroke="#64748b" stroke-width="1.5"/><path d="M80 305v60" fill="none" stroke="#475569" stroke-width="2"/><text x="54" y="343" text-anchor="middle" font-size="24">1</text><text x="106" y="343" text-anchor="middle" font-size="24">•</text><path d="M106 335 H206" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="210" y="305" width="104" height="60" rx="8" fill="#ccfbf1" stroke="#64748b" stroke-width="1.5"/><path d="M262 305v60" fill="none" stroke="#475569" stroke-width="2"/><text x="236" y="343" text-anchor="middle" font-size="24">2</text><text x="288" y="343" text-anchor="middle" font-size="24">•</text><path d="M288 335 H388" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="392" y="305" width="104" height="60" rx="8" fill="#ccfbf1" stroke="#64748b" stroke-width="1.5"/><path d="M444 305v60" fill="none" stroke="#475569" stroke-width="2"/><text x="418" y="343" text-anchor="middle" font-size="24">3</text><text x="470" y="343" text-anchor="middle" font-size="24">•</text><path d="M470 335 H565" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="568" y="305" width="83" height="60" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="609" y="343" text-anchor="middle" font-size="23">'()</text><text x="54" y="294" text-anchor="middle" font-size="16">car</text><text x="106" y="294" text-anchor="middle" font-size="16">cdr</text><text x="340" y="409" text-anchor="middle" font-size="19">每个 cdr 指向剩余的列表，最终到达空表。</text><rect x="40" y="433" width="290" height="62" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><rect x="350" y="433" width="290" height="62" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="185" y="471" text-anchor="middle" font-size="21">(first xs) → 1</text><text x="495" y="471" text-anchor="middle" font-size="21">(rest xs) → '(2 3)</text></g></svg>