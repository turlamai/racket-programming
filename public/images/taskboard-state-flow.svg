<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" role="img" aria-labelledby="t d"><title id="t">Glaze：任务数据的更新路径</title><desc id="d">草稿经 API 进入领域规则，存储更新并广播快照，界面刷新。</desc><rect width="680" height="560" rx="12" fill="#FAF9F6"/><g font-family="Inter, PingFang SC, Microsoft YaHei, system-ui, sans-serif" text-anchor="middle" fill="#2A2820"><text x="340" y="38" font-size="24" font-weight="bold">Glaze：任务数据的更新路径</text><rect x="40" y="65" width="600" height="90" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="340" y="99" font-size="22" font-weight="bold">界面草稿</text><text x="340" y="130" font-size="19">输入标题 → 调用 createTask</text><path d="M340 155v24m-5 -8l5 8 5 -8" fill="none" stroke="#A8532D" stroke-width="2"/><rect x="40" y="184" width="600" height="90" rx="8" fill="#FFE4D6" stroke="#878278"/><text x="340" y="218" font-size="22" font-weight="bold">Racket 领域规则</text><text x="340" y="249" font-size="19">检查标题 → 生成新任务列表</text><path d="M340 274v24m-5 -8l5 8 5 -8" fill="none" stroke="#A8532D" stroke-width="2"/><rect x="40" y="303" width="600" height="90" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="340" y="337" font-size="22" font-weight="bold">后端状态与存储</text><text x="340" y="368" font-size="19">更新 store → 广播状态快照</text><path d="M340 393v24m-5 -8l5 8 5 -8" fill="none" stroke="#A8532D" stroke-width="2"/><rect x="40" y="422" width="600" height="90" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="340" y="456" font-size="22" font-weight="bold">界面显示</text><text x="340" y="487" font-size="19">成功刷新列表；失败保留草稿</text></g></svg>