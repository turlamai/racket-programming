<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" role="img" aria-labelledby="t d"><title id="t">Rivet：任务编辑与提交边界</title><desc id="d">原生界面保存草稿，通过生成客户端调用共享后端，保存成功后更新状态。</desc><rect width="680" height="560" rx="12" fill="#FAF9F6"/><g font-family="Inter, PingFang SC, Microsoft YaHei, system-ui, sans-serif" text-anchor="middle" fill="#2A2820"><text x="340" y="38" font-size="24" font-weight="bold">Rivet：任务编辑与提交边界</text><rect x="40" y="65" width="600" height="90" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="340" y="99" font-size="22" font-weight="bold">原生界面</text><text x="340" y="130" font-size="19">WinUI 3 / SwiftUI / GTK4：编辑草稿</text><path d="M340 155v24m-5 -8l5 8 5 -8" fill="none" stroke="#A8532D" stroke-width="2"/><rect x="40" y="184" width="600" height="90" rx="8" fill="#FFE4D6" stroke="#878278"/><text x="340" y="218" font-size="22" font-weight="bold">类型化接口</text><text x="340" y="249" font-size="19">BoardTask · TaskStatus · update-task</text><path d="M340 274v24m-5 -8l5 8 5 -8" fill="none" stroke="#A8532D" stroke-width="2"/><rect x="40" y="303" width="600" height="90" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="340" y="337" font-size="22" font-weight="bold">Racket 后端</text><text x="340" y="368" font-size="19">验证 → 保存快照 → 提交 State</text><path d="M340 393v24m-5 -8l5 8 5 -8" fill="none" stroke="#A8532D" stroke-width="2"/><rect x="40" y="422" width="600" height="90" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="340" y="456" font-size="22" font-weight="bold">原生界面更新</text><text x="340" y="487" font-size="19">成功显示已提交状态；失败保留草稿</text></g></svg>