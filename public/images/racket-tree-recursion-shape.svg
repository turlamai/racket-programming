<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 610" role="img" aria-labelledby="t d"><title id="t">树形递归求和</title><desc id="d">数据树根为1，子节点2和3，3的子节点4。子树返回2和7，根返回10。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6B6760"/></marker></defs><rect width="680" height="610" rx="16" fill="#FAF9F6"/><g font-family="Inter, PingFang SC, Microsoft YaHei, system-ui, sans-serif" fill="#2A2820"><text x="340" y="40" text-anchor="middle" font-size="25" font-weight="bold">树形递归：先求子树，再合并</text><text x="340" y="82" text-anchor="middle" font-size="21" font-weight="bold">① 数据的形状</text><path d="M340 140L180 207" fill="none" stroke="#6B6760" stroke-width="2"/><path d="M340 140L500 207" fill="none" stroke="#6B6760" stroke-width="2"/><path d="M500 248V305" fill="none" stroke="#6B6760" stroke-width="2"/><circle cx="340" cy="125" r="30" fill="#FFE4D6" stroke="#A8532D" stroke-width="2"/><text x="340" y="133" text-anchor="middle" font-size="25" font-weight="bold">1</text><circle cx="180" cy="225" r="30" fill="#FFE4D6" stroke="#A8532D" stroke-width="2"/><text x="180" y="233" text-anchor="middle" font-size="25" font-weight="bold">2</text><circle cx="500" cy="225" r="30" fill="#FFE4D6" stroke="#A8532D" stroke-width="2"/><text x="500" y="233" text-anchor="middle" font-size="25" font-weight="bold">3</text><circle cx="500" cy="325" r="30" fill="#FFE4D6" stroke="#A8532D" stroke-width="2"/><text x="500" y="333" text-anchor="middle" font-size="25" font-weight="bold">4</text><text x="135" y="275" text-anchor="middle" font-size="17">没有子节点</text><text x="500" y="375" text-anchor="middle" font-size="17">没有子节点</text><text x="340" y="416" text-anchor="middle" font-size="21" font-weight="bold">② 从子树返回结果</text><rect x="40" y="439" width="285" height="55" rx="8" fill="#EBE8E0" stroke="#878278" stroke-width="1.5"/><rect x="355" y="439" width="285" height="55" rx="8" fill="#EBE8E0" stroke="#878278" stroke-width="1.5"/><text x="182" y="473" text-anchor="middle" font-size="21">节点 2：2 + 0 = 2</text><text x="497" y="473" text-anchor="middle" font-size="21">节点 3：3 + 4 = 7</text><path d="M182 494 V515 H340 V535" fill="none" stroke="#6B6760" stroke-width="2" marker-end="url(#a)"/><path d="M497 494 V515 H340" fill="none" stroke="#6B6760" stroke-width="2"/><rect x="140" y="538" width="400" height="52" rx="8" fill="#F5F3EE" stroke="#878278" stroke-width="1.5"/><text x="340" y="571" text-anchor="middle" font-size="23" font-weight="bold">根节点：1 + 2 + 7 = 10</text></g></svg>