<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 630" role="img" aria-labelledby="t d"><title id="t">延续：保存剩余计算</title><desc id="d">在显式提示边界内捕获加一的控制上下文，首次返回10得到11；再次调用保存的延续并传入100得到101。副作用不会回滚。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#878278"/></marker></defs><rect width="680" height="630" rx="12" fill="#FAF9F6"/><g font-family="Inter, PingFang SC, Microsoft YaHei, system-ui, sans-serif" fill="#2A2820"><text x="340" y="40" text-anchor="middle" font-size="25" font-weight="bold">延续：保存接下来要做的计算</text><text x="340" y="80" text-anchor="middle" font-size="22" font-weight="bold">① 首次执行</text><rect x="35" y="100" width="610" height="55" rx="8" fill="#EBE8E0" stroke="#878278" stroke-width="1.5"/><text x="340" y="134" text-anchor="middle" font-size="24">(+ 1 (call/cc ...))</text><path d="M340 155V183" fill="none" stroke="#878278" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="188" width="375" height="95" rx="8" fill="#FFE4D6" stroke="#878278" stroke-width="1.5"/><text x="222" y="222" text-anchor="middle" font-size="21" font-weight="bold">捕获控制上下文 k</text><text x="222" y="253" text-anchor="middle" font-size="21">等待一个值，再加 1</text><path d="M410 235H446" fill="none" stroke="#878278" stroke-width="2" marker-end="url(#a)"/><rect x="450" y="188" width="195" height="95" rx="8" fill="#EBE8E0" stroke="#878278" stroke-width="1.5"/><text x="547" y="222" text-anchor="middle" font-size="20" font-weight="bold">保存 k</text><text x="547" y="253" text-anchor="middle" font-size="22">saved-k</text><path d="M222 283V312" fill="none" stroke="#878278" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="317" width="610" height="58" rx="8" fill="#EBE8E0" stroke="#878278" stroke-width="1.5"/><text x="340" y="353" text-anchor="middle" font-size="23">正常返回 10 → 1 + 10 = 11</text><text x="340" y="420" text-anchor="middle" font-size="22" font-weight="bold">② 在新的提示边界内调用 saved-k</text><rect x="35" y="440" width="610" height="65" rx="8" fill="#FFE4D6" stroke="#878278" stroke-width="1.5"/><text x="340" y="480" text-anchor="middle" font-size="23" font-weight="bold">(saved-k 100) → 1 + 100 = 101</text><text x="340" y="542" text-anchor="middle" font-size="20">替换当前提示边界内的控制上下文</text><text x="340" y="578" text-anchor="middle" font-size="20">不是重新运行捕获点之前的代码</text><text x="340" y="609" text-anchor="middle" font-size="17">已经发生的状态修改与外部副作用不会自动回滚。</text></g></svg>