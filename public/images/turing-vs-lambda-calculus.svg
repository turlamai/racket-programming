<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 650" role="img" aria-labelledby="t d"><title id="t">图灵机与 λ 演算</title><desc id="d">图灵机通过纸带读写和状态转移计算；lambda演算通过变量、抽象、应用与替换计算。两种形式模型在可计算函数意义下等价。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#878278"/></marker></defs><rect width="680" height="650" rx="12" fill="#FAF9F6"/><g font-family="Inter, PingFang SC, Microsoft YaHei, system-ui, sans-serif" fill="#2A2820"><text x="340" y="40" text-anchor="middle" font-size="25" font-weight="bold">两种计算模型，两种观察角度</text><rect x="25" y="70" width="630" height="245" rx="8" fill="#F5F3EE" stroke="#878278" stroke-width="1.5"/><text x="340" y="103" text-anchor="middle" font-size="22" font-weight="bold">图灵机：按照规则改变状态</text><rect x="145" y="132" width="72" height="52" rx="8" fill="#EBE8E0" stroke="#878278" stroke-width="1.5"/><text x="181" y="166" text-anchor="middle" font-size="24">0</text><rect x="223" y="132" width="72" height="52" rx="8" fill="#EBE8E0" stroke="#878278" stroke-width="1.5"/><text x="259" y="166" text-anchor="middle" font-size="24">1</text><rect x="301" y="132" width="72" height="52" rx="8" fill="#FFE4D6" stroke="#878278" stroke-width="1.5"/><text x="337" y="166" text-anchor="middle" font-size="24">1</text><rect x="379" y="132" width="72" height="52" rx="8" fill="#EBE8E0" stroke="#878278" stroke-width="1.5"/><text x="415" y="166" text-anchor="middle" font-size="24">0</text><rect x="457" y="132" width="72" height="52" rx="8" fill="#EBE8E0" stroke="#878278" stroke-width="1.5"/><text x="493" y="166" text-anchor="middle" font-size="24">1</text><text x="119" y="164" text-anchor="middle" font-size="22">…</text><text x="555" y="164" text-anchor="middle" font-size="22">…</text><path d="M337 237V188" fill="none" stroke="#878278" stroke-width="2" marker-end="url(#a)"/><rect x="255" y="241" width="164" height="42" rx="8" fill="#EBE8E0" stroke="#878278" stroke-width="1.5"/><text x="337" y="269" text-anchor="middle" font-size="20">读写头</text><text x="340" y="303" text-anchor="middle" font-size="18">读符号 · 写符号 · 移动 · 改变状态</text><rect x="25" y="335" width="630" height="166" rx="8" fill="#F5F3EE" stroke="#878278" stroke-width="1.5"/><text x="340" y="368" text-anchor="middle" font-size="22" font-weight="bold">λ 演算：按照规则变换表达式</text><text x="340" y="410" text-anchor="middle" font-size="27">(λx. x) y</text><path d="M340 420V448" fill="none" stroke="#878278" stroke-width="2" marker-end="url(#a)"/><text x="340" y="481" text-anchor="middle" font-size="27" font-weight="bold">y</text><path d="M340 501V530" fill="none" stroke="#878278" stroke-width="2" marker-end="url(#a)"/><rect x="25" y="535" width="630" height="91" rx="8" fill="#FFE4D6" stroke="#878278" stroke-width="1.5"/><text x="340" y="566" text-anchor="middle" font-size="22" font-weight="bold">两种模型具有等价的可计算能力</text><text x="340" y="596" text-anchor="middle" font-size="18">Church–Turing 论题将其联系到有效计算。</text></g></svg>