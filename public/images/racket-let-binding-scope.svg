<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 620" role="img" aria-labelledby="t d"><title id="t">let 家族的绑定可见范围</title><desc id="d">外层 x 为10，let 中 y 引用外层 x 得11；let* 中 y 引用新 x 得2；letrec 的过程体可引用自身但未初始化的值不能提前读取。</desc><rect width="680" height="620" rx="12" fill="#FAF9F6"/><g font-family="Inter, PingFang SC, Microsoft YaHei, system-ui, sans-serif" text-anchor="middle" fill="#2A2820"><text x="340" y="40" font-size="24" font-weight="bold">let 家族：名字什么时候可见？</text><rect x="35" y="65" width="610" height="49" rx="8" fill="#F5F3EE" stroke="#878278" stroke-width="1.4"/><text x="340" y="96" font-size="21" font-weight="bold">外层绑定：x = 10</text><rect x="35" y="132" width="610" height="127" rx="8" fill="#F5F3EE" stroke="#878278" stroke-width="1.4"/><text x="340" y="161" font-size="21" font-weight="bold">let：右值引用外层绑定</text><text x="340" y="196" font-size="21">(let ([x 1] [y (+ x 1)]) y)</text><text x="340" y="231" font-size="19">结果 11：y 读取外层 x = 10</text><rect x="35" y="275" width="610" height="127" rx="8" fill="#F5F3EE" stroke="#878278" stroke-width="1.4"/><text x="340" y="304" font-size="21" font-weight="bold">let*：后面的右值看到前面绑定</text><text x="340" y="339" font-size="21">(let* ([x 1] [y (+ x 1)]) y)</text><text x="340" y="374" font-size="19">结果 2：y 读取新绑定 x = 1</text><rect x="35" y="418" width="610" height="127" rx="8" fill="#FFE4D6" stroke="#878278" stroke-width="1.4"/><text x="340" y="447" font-size="21" font-weight="bold">letrec：名字预先可见</text><text x="340" y="482" font-size="17">(letrec ([f (lambda () f)]) (procedure? (f)))</text><text x="340" y="517" font-size="19">结果 #t：调用时 f 已经初始化</text><text x="340" y="590" font-size="19">右值都从左到右求值；可见不代表已经初始化。</text></g></svg>