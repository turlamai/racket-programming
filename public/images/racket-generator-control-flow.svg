<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 650" role="img" aria-labelledby="t d"><title id="t">生成器与调用者的控制流</title><desc id="d">每次调用生成器，控制权进入主体，yield 返回一个值并暂停；后续调用恢复；主体结束后状态为done。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#A8532D"/></marker></defs><rect width="680" height="650" rx="12" fill="#FAF9F6"/><g font-family="Inter, PingFang SC, Microsoft YaHei, system-ui, sans-serif" fill="#2A2820"><text x="340" y="40" text-anchor="middle" font-size="25" font-weight="bold">生成器：调用、暂停与恢复</text><text x="145" y="88" text-anchor="middle" font-size="22" font-weight="bold">调用者</text><text x="525" y="88" text-anchor="middle" font-size="22" font-weight="bold">生成器 g</text><path d="M145 106V580 M525 106V580" stroke="#C8C3B8" stroke-width="2" stroke-dasharray="5 5"/><path d="M145 130H525" fill="none" stroke="#A8532D" stroke-width="2" marker-end="url(#a)"/><text x="335" y="120" text-anchor="middle" font-size="20">(g)</text><text x="525" y="153" text-anchor="middle" font-size="17">fresh → running</text><path d="M525 180H145" fill="none" stroke="#A8532D" stroke-width="2" marker-end="url(#a)"/><text x="335" y="170" text-anchor="middle" font-size="21" font-weight="bold">'a</text><text x="525" y="202" text-anchor="middle" font-size="17">suspended</text><path d="M145 250H525" fill="none" stroke="#A8532D" stroke-width="2" marker-end="url(#a)"/><text x="335" y="240" text-anchor="middle" font-size="20">(g)</text><text x="525" y="273" text-anchor="middle" font-size="17">恢复执行</text><path d="M525 300H145" fill="none" stroke="#A8532D" stroke-width="2" marker-end="url(#a)"/><text x="335" y="290" text-anchor="middle" font-size="21" font-weight="bold">'b</text><text x="525" y="322" text-anchor="middle" font-size="17">suspended</text><path d="M145 370H525" fill="none" stroke="#A8532D" stroke-width="2" marker-end="url(#a)"/><text x="335" y="360" text-anchor="middle" font-size="20">(g)</text><text x="525" y="393" text-anchor="middle" font-size="17">恢复执行</text><path d="M525 420H145" fill="none" stroke="#A8532D" stroke-width="2" marker-end="url(#a)"/><text x="335" y="410" text-anchor="middle" font-size="21" font-weight="bold">'c</text><text x="525" y="442" text-anchor="middle" font-size="17">suspended</text><path d="M145 490H525" fill="none" stroke="#A8532D" stroke-width="2" marker-end="url(#a)"/><text x="335" y="480" text-anchor="middle" font-size="20">(g)</text><text x="525" y="513" text-anchor="middle" font-size="17">主体结束</text><path d="M525 540H145" fill="none" stroke="#A8532D" stroke-width="2" marker-end="url(#a)"/><text x="335" y="530" text-anchor="middle" font-size="21" font-weight="bold">'done</text><text x="525" y="562" text-anchor="middle" font-size="17">done</text><rect x="35" y="594" width="610" height="40" rx="8" fill="#FFE4D6" stroke="#878278" stroke-width="1.5"/><text x="340" y="620" text-anchor="middle" font-size="19">结束后无参数调用仍返回主体的最终结果。</text></g></svg>