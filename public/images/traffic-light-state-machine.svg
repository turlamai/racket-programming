<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 530" role="img" aria-labelledby="t d"><title id="t">简化红绿灯状态机</title><desc id="d">教学模型包含红绿黄三个状态；每次定时事件调用 next，按红绿黄红循环；三种颜色仅表示状态，时长是教学示例。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#A8532D"/></marker></defs><rect width="680" height="530" rx="12" fill="#FAF9F6"/><g font-family="Inter, PingFang SC, Microsoft YaHei, system-ui, sans-serif" fill="#2A2820"><text x="340" y="40" text-anchor="middle" font-size="25" font-weight="bold">红绿灯：状态、转移与驱动</text><circle cx="125" cy="240" r="70" fill="#F8D7D4" stroke="#A33B32" stroke-width="2"/><text x="125" y="233" text-anchor="middle" font-size="22" font-weight="bold">红灯</text><text x="125" y="265" text-anchor="middle" font-size="21">'red</text><circle cx="340" cy="120" r="70" fill="#D8E9D7" stroke="#386A45" stroke-width="2"/><text x="340" y="113" text-anchor="middle" font-size="22" font-weight="bold">绿灯</text><text x="340" y="145" text-anchor="middle" font-size="21">'green</text><circle cx="555" cy="240" r="70" fill="#F8E9BD" stroke="#876313" stroke-width="2"/><text x="555" y="233" text-anchor="middle" font-size="22" font-weight="bold">黄灯</text><text x="555" y="265" text-anchor="middle" font-size="21">'yellow</text><path d="M185 204L278 153" fill="none" stroke="#A8532D" stroke-width="2" marker-end="url(#a)"/><path d="M402 153L495 204" fill="none" stroke="#A8532D" stroke-width="2" marker-end="url(#a)"/><path d="M485 240H195" fill="none" stroke="#A8532D" stroke-width="2" marker-end="url(#a)"/><text x="220" y="155" text-anchor="middle" font-size="17">到时间</text><text x="460" y="155" text-anchor="middle" font-size="17">到时间</text><text x="340" y="229" text-anchor="middle" font-size="17">到时间</text><rect x="30" y="338" width="620" height="155" rx="8" fill="#F5F3EE" stroke="#878278" stroke-width="1.5"/><text x="340" y="370" text-anchor="middle" font-size="21" font-weight="bold">驱动：等待当前状态的时长</text><text x="340" y="403" text-anchor="middle" font-size="20">转移：next(state) 返回下一个状态</text><text x="340" y="435" text-anchor="middle" font-size="20">输出：显示当前状态</text><text x="340" y="469" text-anchor="middle" font-size="17">教学模型，不是实际交通信号控制方案。</text></g></svg>