<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" role="img" aria-labelledby="t d"><title id="t">条件表达式的求值</title><desc id="d">先计算 lt 3 5 得到真，只计算 then 数字100，跳过 else 数字200。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#A8532D"/></marker></defs><rect width="680" height="500" rx="12" fill="#FAF9F6"/><g font-family="Inter, PingFang SC, Microsoft YaHei, system-ui, sans-serif" fill="#2A2820"><text x="340" y="40" text-anchor="middle" font-size="24" font-weight="bold">if：先判断，只计算选中的分支</text><rect x="35" y="75" width="610" height="60" rx="8" fill="#EBE8E0" stroke="#878278" stroke-width="1.5"/><text x="340" y="112" text-anchor="middle" font-size="21">(if-expr (lt (num 3) (num 5)) …)</text><path d="M340 135V160" fill="none" stroke="#A8532D" stroke-width="2" marker-end="url(#a)"/><rect x="155" y="165" width="370" height="70" rx="8" fill="#FFE4D6" stroke="#878278" stroke-width="1.5"/><text x="340" y="193" text-anchor="middle" font-size="20" font-weight="bold">① 求值条件</text><text x="340" y="220" text-anchor="middle" font-size="24">3 &lt; 5 → #t</text><path d="M340 235V254H180V280" fill="none" stroke="#A8532D" stroke-width="2" marker-end="url(#a)"/><path d="M340 254H500V280" stroke="#878278" stroke-dasharray="6 5" fill="none"/><rect x="35" y="285" width="290" height="87" rx="8" fill="#FFE4D6" stroke="#878278" stroke-width="1.5"/><text x="180" y="315" text-anchor="middle" font-size="21" font-weight="bold">② then：执行</text><text x="180" y="346" text-anchor="middle" font-size="22">(num 100) → 100</text><rect x="355" y="285" width="290" height="87" rx="8" fill="#EBE8E0" stroke="#878278" stroke-width="1.5"/><text x="500" y="315" text-anchor="middle" font-size="21">else：跳过</text><text x="500" y="346" text-anchor="middle" font-size="22">(num 200)</text><path d="M180 372V394H340V415" fill="none" stroke="#A8532D" stroke-width="2" marker-end="url(#a)"/><rect x="165" y="420" width="350" height="55" rx="8" fill="#FFE4D6" stroke="#878278" stroke-width="1.5"/><text x="340" y="455" text-anchor="middle" font-size="24" font-weight="bold">③ 最终结果：100</text></g></svg>