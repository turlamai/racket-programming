<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 570" role="img" aria-labelledby="t d"><title id="t">FFI：跨越语言与内存边界</title><desc id="d">Racket 根据函数签名调用C，遵守 ABI，返回值转换，按所有权释放内存。</desc><rect width="680" height="570" rx="12" fill="#FAF9F6"/><g font-family="Inter, PingFang SC, Microsoft YaHei, system-ui, sans-serif" text-anchor="middle" fill="#2A2820"><text x="340" y="38" font-size="24" font-weight="bold">FFI：跨越语言与内存边界</text><rect x="40" y="65" width="600" height="92" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="340" y="97" font-size="22" font-weight="bold">Racket 调用</text><text x="340" y="130" font-size="19">(add 2 3)</text><path d="M340 157v21m-5 -8l5 8 5 -8" stroke="#A8532D" stroke-width="2" fill="none"/><rect x="40" y="183" width="600" height="92" rx="8" fill="#FFE4D6" stroke="#878278"/><text x="340" y="215" font-size="22" font-weight="bold">FFI 类型声明</text><text x="340" y="248" font-size="19">(_fun _int _int -&gt; _int)</text><path d="M340 275v21m-5 -8l5 8 5 -8" stroke="#A8532D" stroke-width="2" fill="none"/><rect x="40" y="301" width="600" height="92" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="340" y="333" font-size="22" font-weight="bold">C 函数与 ABI</text><text x="340" y="366" font-size="19">参数宽度、调用约定、指针有效性</text><path d="M340 393v21m-5 -8l5 8 5 -8" stroke="#A8532D" stroke-width="2" fill="none"/><rect x="40" y="419" width="600" height="92" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="340" y="451" font-size="22" font-weight="bold">返回值与资源</text><text x="340" y="484" font-size="19">转换结果 · 按所有权释放内存</text></g></svg>