<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" role="img" aria-labelledby="t d"><title id="t">自定义语言的三个阶段</title><desc id="d">Reader 构造模块语法对象，Expander 展开绑定与宏，运行时执行。</desc><rect width="680" height="480" rx="12" fill="#FAF9F6"/><g font-family="Inter, PingFang SC, Microsoft YaHei, system-ui, sans-serif" text-anchor="middle" fill="#2A2820"><text x="340" y="38" font-size="24" font-weight="bold">自定义语言的三个阶段</text><rect x="35" y="65" width="610" height="98" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="340" y="98" font-size="22" font-weight="bold">Reader · 读取</text><text x="340" y="132" font-size="19">源文本 → module 语法对象</text><path d="M340 163v23m-5 -8l5 8 5 -8" fill="none" stroke="#A8532D" stroke-width="2"/><rect x="35" y="192" width="610" height="98" rx="8" fill="#FFE4D6" stroke="#878278"/><text x="340" y="225" font-size="22" font-weight="bold">Expander · 展开</text><text x="340" y="259" font-size="19">模块语言规则 → 核心形式</text><path d="M340 290v23m-5 -8l5 8 5 -8" fill="none" stroke="#A8532D" stroke-width="2"/><rect x="35" y="319" width="610" height="98" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="340" y="352" font-size="22" font-weight="bold">编译与执行</text><text x="340" y="386" font-size="19">模块实例化 → 输出或其他效果</text></g></svg>