<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 550" role="img" aria-labelledby="t d"><title id="t">表达式与数据</title><desc id="d">同样的括号形状，在函数调用中求值得到3，在quote中产生列表。语法对象还携带词法上下文。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6B6760"/></marker></defs><rect width="680" height="550" rx="16" fill="#FAF9F6"/><g font-family="Inter, PingFang SC, Microsoft YaHei, system-ui, sans-serif" fill="#2A2820"><text x="340" y="40" text-anchor="middle" font-size="25" font-weight="bold">相似的形状，不同的求值规则</text><rect x="30" y="78" width="300" height="75" rx="8" fill="#F5F3EE" stroke="#878278" stroke-width="1.5"/><rect x="350" y="78" width="300" height="75" rx="8" fill="#FFE4D6" stroke="#878278" stroke-width="1.5"/><text x="180" y="108" text-anchor="middle" font-size="19" font-weight="bold">函数调用</text><text x="180" y="137" text-anchor="middle" font-size="24">(+ 1 2)</text><text x="500" y="108" text-anchor="middle" font-size="19" font-weight="bold">引用数据</text><text x="500" y="137" text-anchor="middle" font-size="24">'(+ 1 2)</text><path d="M180 153V211" fill="none" stroke="#6B6760" stroke-width="2" marker-end="url(#a)"/><path d="M500 153V211" fill="none" stroke="#6B6760" stroke-width="2" marker-end="url(#a)"/><text x="180" y="193" text-anchor="middle" font-size="17">执行加法</text><text x="500" y="193" text-anchor="middle" font-size="17">quote 不求值内部</text><rect x="30" y="216" width="300" height="123" rx="8" fill="#EBE8E0" stroke="#878278" stroke-width="1.5"/><text x="180" y="254" text-anchor="middle" font-size="20">数字</text><text x="180" y="302" text-anchor="middle" font-size="36" font-weight="bold">3</text><rect x="350" y="216" width="300" height="123" rx="8" fill="#EBE8E0" stroke="#878278" stroke-width="1.5"/><text x="500" y="246" text-anchor="middle" font-size="19">三个元素的列表</text><rect x="365" y="263" width="85" height="40" rx="8" fill="#FFE4D6" stroke="#878278" stroke-width="1.5"/><text x="407" y="291" text-anchor="middle" font-size="23">+</text><text x="407" y="325" text-anchor="middle" font-size="16">符号</text><rect x="457" y="263" width="85" height="40" rx="8" fill="#FFE4D6" stroke="#878278" stroke-width="1.5"/><text x="499" y="291" text-anchor="middle" font-size="23">1</text><text x="499" y="325" text-anchor="middle" font-size="16">数字</text><rect x="549" y="263" width="85" height="40" rx="8" fill="#FFE4D6" stroke="#878278" stroke-width="1.5"/><text x="591" y="291" text-anchor="middle" font-size="23">2</text><text x="591" y="325" text-anchor="middle" font-size="16">数字</text><rect x="30" y="372" width="620" height="74" rx="8" fill="#F5F3EE" stroke="#878278" stroke-width="1.5"/><text x="340" y="400" text-anchor="middle" font-size="21">普通数据可用 first、rest 等函数处理</text><text x="340" y="428" text-anchor="middle" font-size="18">eval 在指定命名空间中求值可信代码</text><rect x="30" y="466" width="620" height="65" rx="8" fill="#EBE8E0" stroke="#878278" stroke-width="1.5"/><text x="340" y="491" text-anchor="middle" font-size="21" font-weight="bold">宏处理语法对象，而非仅仅普通列表</text><text x="340" y="517" text-anchor="middle" font-size="18">语法对象还保留绑定上下文及源码信息</text></g></svg>