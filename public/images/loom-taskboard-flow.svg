<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 630" role="img" aria-labelledby="t d"><title id="t">Loom Taskboard 的表单提交</title><desc id="d">浏览器提交 POST 表单，验证会话令牌和输入，事务写入 SQLite，返回重定向，浏览器 GET 首页读取新列表。失败不进入成功重定向。</desc><rect width="680" height="630" rx="12" fill="#FAF9F6"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#A8532D"/></marker></defs><g font-family="Inter, PingFang SC, Microsoft YaHei, system-ui, sans-serif" text-anchor="middle" fill="#2A2820"><text x="340" y="38" font-size="25" font-weight="bold">Loom：从表单到持久化数据</text><rect x="45" y="65" width="590" height="78" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="340" y="95" font-size="22" font-weight="bold">浏览器</text><text x="340" y="122" font-size="19">POST /tasks · 标题 + CSRF 令牌</text><path d="M340 143v20" stroke="#A8532D" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="168" width="590" height="78" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="340" y="198" font-size="22" font-weight="bold">Loom 中间件</text><text x="340" y="225" font-size="19">检查会话与令牌</text><path d="M340 246v20" stroke="#A8532D" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="271" width="590" height="78" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="340" y="301" font-size="22" font-weight="bold">Racket 业务逻辑</text><text x="340" y="328" font-size="19">验证标题 · 生成任务 ID</text><path d="M340 349v20" stroke="#A8532D" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="374" width="590" height="78" rx="8" fill="#FFE4D6" stroke="#878278"/><text x="340" y="404" font-size="22" font-weight="bold">SQLite 事务</text><text x="340" y="431" font-size="19">插入记录 · 成功提交</text><path d="M340 452v20" stroke="#A8532D" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="477" width="590" height="78" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="340" y="507" font-size="22" font-weight="bold">重新读取页面</text><text x="340" y="534" font-size="19">重定向 → GET / → 显示任务列表</text><text x="340" y="596" font-size="18">校验或写入失败时返回错误，不宣称保存成功。</text></g></svg>