<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 570" role="img" aria-labelledby="t d"><title id="t">同一个模块，不同执行入口</title><desc id="d">区分模块导入、直接运行、测试和发行。以下四项是独立入口，不是依次执行的步骤。</desc><rect width="680" height="570" rx="12" fill="#FAF9F6"/><g font-family="Inter, PingFang SC, Microsoft YaHei, system-ui, sans-serif" text-anchor="middle" fill="#2A2820"><text x="340" y="38" font-size="24" font-weight="bold">同一个模块，不同执行入口</text><rect x="40" y="65" width="600" height="92" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="340" y="98" font-size="22" font-weight="bold">require：导入模块</text><text x="340" y="130" font-size="19">访问 provide 导出的绑定</text><rect x="40" y="183" width="600" height="92" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="340" y="216" font-size="22" font-weight="bold">racket main.rkt：直接运行</text><text x="340" y="248" font-size="19">实例化模块，运行 main 子模块（若存在）</text><rect x="40" y="301" width="600" height="92" rx="8" fill="#FFE4D6" stroke="#878278"/><text x="340" y="334" font-size="22" font-weight="bold">raco test main.rkt：测试</text><text x="340" y="366" font-size="19">通常运行 test 子模块</text><rect x="40" y="419" width="600" height="92" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="340" y="452" font-size="22" font-weight="bold">raco exe / distribute：分发</text><text x="340" y="484" font-size="19">生成入口及发行目录</text></g></svg>