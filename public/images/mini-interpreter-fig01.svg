<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 570" role="img" aria-labelledby="t d"><title id="t">算术语法树与求值</title><desc id="d">加法节点有数字1和乘法节点两个子节点，乘法有2和3两个子节点。先计算1，再计算2和3相乘，最后求和。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#A8532D"/></marker></defs><rect width="680" height="570" rx="12" fill="#FAF9F6"/><g font-family="Inter, PingFang SC, Microsoft YaHei, system-ui, sans-serif" fill="#2A2820"><text x="340" y="40" text-anchor="middle" font-size="25" font-weight="bold">从语法树到求值结果</text><text x="340" y="76" text-anchor="middle" font-size="19">(add (num 1) (mul (num 2) (num 3)))</text><path d="M340 151L120 208 M340 151L460 208 M460 269L365 326 M460 269L555 326" fill="none" stroke="#878278" stroke-width="1.5"/><rect x="260" y="100" width="160" height="51" rx="8" fill="#FFE4D6" stroke="#878278" stroke-width="1.5"/><text x="340" y="133" text-anchor="middle" font-size="23" font-weight="bold">add → 7</text><rect x="50" y="208" width="140" height="61" rx="8" fill="#EBE8E0" stroke="#878278" stroke-width="1.5"/><text x="120" y="245" text-anchor="middle" font-size="23">num 1</text><rect x="380" y="208" width="160" height="61" rx="8" fill="#FFE4D6" stroke="#878278" stroke-width="1.5"/><text x="460" y="245" text-anchor="middle" font-size="23" font-weight="bold">mul → 6</text><rect x="295" y="326" width="140" height="61" rx="8" fill="#EBE8E0" stroke="#878278" stroke-width="1.5"/><text x="365" y="363" text-anchor="middle" font-size="23">num 2</text><rect x="485" y="326" width="140" height="61" rx="8" fill="#EBE8E0" stroke="#878278" stroke-width="1.5"/><text x="555" y="363" text-anchor="middle" font-size="23">num 3</text><text x="340" y="426" text-anchor="middle" font-size="21" font-weight="bold">求值顺序：先左子树，再右子树</text><rect x="30" y="448" width="620" height="95" rx="8" fill="#F5F3EE" stroke="#878278" stroke-width="1.5"/><text x="340" y="480" text-anchor="middle" font-size="23">① 1    ② 2    ③ 3</text><text x="340" y="512" text-anchor="middle" font-size="23" font-weight="bold">④ 2 × 3 = 6    ⑤ 1 + 6 = 7</text></g></svg>