<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" role="img" aria-labelledby="t d"><title id="t">Rivet 的桌面原生宿主与共享后端</title><desc id="d">Windows WinUI 3、macOS SwiftUI、Linux GTK4 分别使用生成的类型化客户端，经 RVT1 调用嵌入式 Racket CS 后端。</desc><rect width="680" height="420" rx="12" fill="#FAF9F6"/><g font-family="Inter, PingFang SC, Microsoft YaHei, system-ui, sans-serif" text-anchor="middle" fill="#2A2820"><text x="340" y="38" font-size="24" font-weight="bold">Rivet：独立原生界面，共享业务逻辑</text><rect x="20" y="65" width="200" height="83" rx="8" fill="#F5F3EE" stroke="#C8C3B8"/><text x="120" y="98" font-size="22" font-weight="bold">Windows</text><text x="120" y="126" font-size="19">WinUI 3</text><path d="M120 148V180" stroke="#878278" stroke-width="1.5"/><rect x="240" y="65" width="200" height="83" rx="8" fill="#F5F3EE" stroke="#C8C3B8"/><text x="340" y="98" font-size="22" font-weight="bold">macOS</text><text x="340" y="126" font-size="19">SwiftUI</text><path d="M340 148V180" stroke="#878278" stroke-width="1.5"/><rect x="460" y="65" width="200" height="83" rx="8" fill="#F5F3EE" stroke="#C8C3B8"/><text x="560" y="98" font-size="22" font-weight="bold">Linux</text><text x="560" y="126" font-size="19">GTK4</text><path d="M560 148V180" stroke="#878278" stroke-width="1.5"/><path d="M120 180H560 M340 180V206" stroke="#878278" stroke-width="1.5" fill="none"/><rect x="85" y="206" width="510" height="68" rx="8" fill="#EBE8E0" stroke="#878278"/><text x="340" y="233" font-size="22" font-weight="bold">生成的类型化客户端</text><text x="340" y="259" font-size="17">RVT1 · RPC · Event · State</text><path d="M340 274V304m-5 -8l5 8 5 -8" stroke="#A8532D" stroke-width="2" fill="none"/><rect x="85" y="310" width="510" height="85" rx="8" fill="#FFE4D6" stroke="#D97757"/><text x="340" y="344" font-size="23" font-weight="bold">嵌入式 Racket CS 后端</text><text x="340" y="372" font-size="19">共享业务逻辑、数据与状态</text></g></svg>