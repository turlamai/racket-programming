<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 490" role="img" aria-labelledby="t d"><title id="t">从程序到计算结果</title><desc id="d">用语言描述购物清单加法，由语言实现读取并安排执行，处理器完成计算，得到总价十元。</desc><rect width="680" height="490" rx="12" fill="#FAF9F6"/><g font-family="Inter, PingFang SC, Microsoft YaHei, system-ui, sans-serif" text-anchor="middle" fill="#2A2820"><text x="340" y="40" font-size="25" font-weight="bold">文字为什么能让电脑工作？</text><rect x="40" y="65" width="600" height="77" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="340" y="94" font-size="22" font-weight="bold">源程序</text><text x="340" y="121" font-size="19">描述数据：3、5、2；操作：相加</text><path d="M340 142v18m-5 -7l5 7 5 -7" stroke="#A8532D" stroke-width="2" fill="none"/><rect x="40" y="165" width="600" height="77" rx="8" fill="#FFE4D6" stroke="#878278"/><text x="340" y="194" font-size="22" font-weight="bold">语言实现</text><text x="340" y="221" font-size="19">读取、检查、转换并安排执行</text><path d="M340 242v18m-5 -7l5 7 5 -7" stroke="#A8532D" stroke-width="2" fill="none"/><rect x="40" y="265" width="600" height="77" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="340" y="294" font-size="22" font-weight="bold">计算机执行</text><text x="340" y="321" font-size="19">处理器与运行环境完成操作</text><path d="M340 342v18m-5 -7l5 7 5 -7" stroke="#A8532D" stroke-width="2" fill="none"/><rect x="40" y="365" width="600" height="77" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="340" y="394" font-size="22" font-weight="bold">结果</text><text x="340" y="421" font-size="19">总价：10 元</text></g></svg>