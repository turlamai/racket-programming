<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" role="img" aria-labelledby="title desc"><title id="title">Loom 请求处理过程</title><desc id="desc">浏览器发送 GET 请求，经 Loom 路由匹配到 Racket 函数，再由 HTML 响应返回浏览器。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6B6760"/></marker></defs><rect width="680" height="470" rx="16" fill="#FAF9F6"/><g font-family="Inter, PingFang SC, Microsoft YaHei, system-ui, sans-serif" text-anchor="middle" fill="#2A2820"><rect x="180" y="20" width="320" height="58" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="340" y="55" font-size="21">浏览器</text><rect x="180" y="130" width="320" height="68" rx="8" fill="#EBE8E0" stroke="#878278"/><text x="340" y="157" font-size="20">Loom 路由匹配</text><text x="340" y="182" font-size="16">GET /tasks/:id</text><rect x="180" y="245" width="320" height="68" rx="8" fill="#FFE4D6" stroke="#A8532D"/><text x="340" y="272" font-size="20">Racket 处理函数</text><text x="340" y="297" font-size="16">取得 id，生成 HTML 树</text><rect x="180" y="365" width="320" height="68" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="340" y="392" font-size="20">HTTP 响应</text><text x="340" y="417" font-size="16">200 OK + HTML</text><g fill="none" stroke="#6B6760" stroke-width="2" marker-end="url(#arrow)"><path d="M340 78 V126"/><path d="M340 198 V241"/><path d="M340 313 V361"/><path d="M500 400 H600 V49 H505"/></g><g font-size="15" fill="#4A4740"><text x="430" y="108">GET /tasks/42</text><text x="415" y="225">id = 42</text><text x="415" y="342">html-response</text><text x="645" y="215" transform="rotate(-90 645 215)">返回浏览器并显示页面</text></g></g></svg>