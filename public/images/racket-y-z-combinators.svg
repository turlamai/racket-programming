<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 590" role="img" aria-labelledby="t d"><title id="t">Y 与 Z 组合子的严格求值对照</title><desc id="d">Y 在严格求值时反复展开自我应用；Z 将自我应用放进单参数函数体，递归分支调用时才展开。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#A8532D"/></marker></defs><rect width="680" height="590" rx="12" fill="#FAF9F6"/><g font-family="Inter, PingFang SC, Microsoft YaHei, system-ui, sans-serif" fill="#2A2820"><text x="340" y="40" text-anchor="middle" font-size="24" font-weight="bold">为什么 Racket 使用 Z 而不是 Y？</text><text x="340" y="79" text-anchor="middle" font-size="22" font-weight="bold">Y：实参必须先求值</text><rect x="45" y="95" width="590" height="65" rx="8" fill="#EBE8E0" stroke="#878278" stroke-width="1.5"/><text x="340" y="135" text-anchor="middle" font-size="25">(g (x x))</text><path d="M340 160V188" fill="none" stroke="#A8532D" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="193" width="590" height="75" rx="8" fill="#EBE8E0" stroke="#878278" stroke-width="1.5"/><text x="340" y="222" text-anchor="middle" font-size="23">先算 (x x)，又得到 (g (x x))</text><text x="340" y="250" text-anchor="middle" font-size="18">不断展开，尚未进入 g 的函数体</text><text x="340" y="312" text-anchor="middle" font-size="22" font-weight="bold">Z：把自我应用放进函数体</text><rect x="45" y="330" width="590" height="66" rx="8" fill="#FFE4D6" stroke="#878278" stroke-width="1.5"/><text x="340" y="370" text-anchor="middle" font-size="24">(g (lambda (v) ((x x) v)))</text><path d="M340 396V423" fill="none" stroke="#A8532D" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="428" width="590" height="60" rx="8" fill="#EBE8E0" stroke="#878278" stroke-width="1.5"/><text x="340" y="465" text-anchor="middle" font-size="22">g 立即收到一个过程值 self</text><path d="M340 488V515" fill="none" stroke="#A8532D" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="520" width="590" height="50" rx="8" fill="#FFE4D6" stroke="#878278" stroke-width="1.5"/><text x="340" y="552" text-anchor="middle" font-size="21" font-weight="bold">仅在调用 (self v) 时展开下一层</text></g></svg>