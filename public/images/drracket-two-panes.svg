<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 510" role="img" aria-labelledby="t d"><title id="t">DrRacket 定义区与交互区示意</title><desc id="d">上方编辑函数定义，点击 Run 后，在下方交互区输入 square 5 并得到 25。此图不是软件截图。</desc><rect width="680" height="510" rx="16" fill="#FAF9F6"/><g font-family="Inter, PingFang SC, Microsoft YaHei, system-ui, sans-serif" fill="#2A2820"><rect x="24" y="20" width="632" height="444" rx="10" fill="#FAF9F6" stroke="#878278" stroke-width="2"/><path d="M24 72H656" stroke="#878278"/><text x="44" y="52" font-size="21" font-weight="bold">DrRacket</text><rect x="538" y="30" width="100" height="32" rx="6" fill="#FFE4D6" stroke="#A8532D"/><text x="588" y="52" text-anchor="middle" font-size="19">Run</text><rect x="40" y="90" width="600" height="174" rx="6" fill="#F5F3EE" stroke="#C8C3B8"/><text x="58" y="119" font-size="20" font-weight="bold">① 定义区 · 编写并保存程序</text><g font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="22"><text x="58" y="158">#lang racket</text><text x="58" y="195">(define (square x)</text><text x="82" y="225">(* x x))</text></g><rect x="40" y="282" width="600" height="164" rx="6" fill="#FFF4EE" stroke="#A8532D"/><text x="58" y="311" font-size="20" font-weight="bold">② 交互区 · 输入表达式并查看结果</text><g font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="22"><text x="58" y="352">&gt; (square 5)</text><text x="58" y="385" fill="#A8532D">25</text><text x="58" y="418">&gt; </text></g><text x="340" y="491" font-size="17" text-anchor="middle">界面功能示意图，非实际截图；外观随平台和版本变化。</text></g></svg>