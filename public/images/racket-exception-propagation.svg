<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 600" role="img" aria-labelledby="t d"><title id="t">异常传播与处理</title><desc id="d">with-handlers 内调用 a b c，c 抛出异常，退出主体，匹配谓词后执行 handler，结果返回外层。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#A8532D"/></marker></defs><rect width="680" height="600" rx="12" fill="#FAF9F6"/><g font-family="Inter, PingFang SC, Microsoft YaHei, system-ui, sans-serif" fill="#2A2820"><text x="340" y="40" text-anchor="middle" font-size="25" font-weight="bold">异常：退出当前计算，交给处理器</text><rect x="35" y="70" width="610" height="340" rx="8" fill="#F5F3EE" stroke="#878278" stroke-width="1.5"/><text x="340" y="100" text-anchor="middle" font-size="22" font-weight="bold">with-handlers 的动态范围</text><rect x="70" y="120" width="230" height="45" rx="8" fill="#EBE8E0" stroke="#878278" stroke-width="1.5"/><text x="185" y="149" text-anchor="middle" font-size="22">(a)</text><path d="M185 165V183" fill="none" stroke="#A8532D" stroke-width="2" marker-end="url(#a)"/><rect x="70" y="185" width="230" height="45" rx="8" fill="#EBE8E0" stroke="#878278" stroke-width="1.5"/><text x="185" y="214" text-anchor="middle" font-size="22">(b)</text><path d="M185 230V248" fill="none" stroke="#A8532D" stroke-width="2" marker-end="url(#a)"/><rect x="70" y="250" width="230" height="45" rx="8" fill="#EBE8E0" stroke="#878278" stroke-width="1.5"/><text x="185" y="279" text-anchor="middle" font-size="22">(c)</text><path d="M185 295V313" fill="none" stroke="#A8532D" stroke-width="2" marker-end="url(#a)"/><rect x="70" y="315" width="230" height="45" rx="8" fill="#FFE4D6" stroke="#878278" stroke-width="1.5"/><text x="185" y="344" text-anchor="middle" font-size="22">(error "oops")</text><path d="M300 337H480V193" fill="none" stroke="#A8532D" stroke-width="2" marker-end="url(#a)"/><rect x="340" y="120" width="270" height="69" rx="8" fill="#FFE4D6" stroke="#878278" stroke-width="1.5"/><text x="475" y="148" text-anchor="middle" font-size="21" font-weight="bold">匹配 exn:fail?</text><text x="475" y="174" text-anchor="middle" font-size="19">执行对应 handler</text><text x="475" y="277" text-anchor="middle" font-size="20">退出主体</text><text x="475" y="302" text-anchor="middle" font-size="17">不回到 error 后面</text><path d="M610 155H630V451H340V474" fill="none" stroke="#A8532D" stroke-width="2" marker-end="url(#a)"/><rect x="90" y="480" width="500" height="65" rx="8" fill="#FFE4D6" stroke="#878278" stroke-width="1.5"/><text x="340" y="518" text-anchor="middle" font-size="23" font-weight="bold">整个表达式的结果：'handled</text><text x="340" y="575" text-anchor="middle" font-size="17">图中展示 with-handlers，而非任意底层异常处理器。</text></g></svg>