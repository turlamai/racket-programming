<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" role="img" aria-labelledby="t d"><title id="t">界面与后台任务的控制流</title><desc id="d">界面接收点击后启动后台任务，事件循环继续处理输入；后台计算完成后提交结果，界面更新状态。</desc><rect width="680" height="460" rx="12" fill="#FAF9F6"/><g font-family="Inter, PingFang SC, Microsoft YaHei, system-ui, sans-serif" text-anchor="middle" fill="#2A2820"><text x="340" y="38" font-size="24" font-weight="bold">界面线程与后台任务</text><text x="170" y="85" font-size="21" font-weight="bold">界面事件循环</text><text x="510" y="85" font-size="21" font-weight="bold">后台任务</text><path d="M170 100V385 M510 100V385" stroke="#C8C3B8" stroke-dasharray="6 5" stroke-width="2"/><rect x="45" y="112" width="250" height="48" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="170" y="143" font-size="20">点击 · 禁止重复提交</text><path d="M295 136H510m-9 -5l9 5 -9 5" fill="none" stroke="#A8532D" stroke-width="2"/><text x="402" y="125" font-size="16">启动</text><rect x="385" y="169" width="250" height="115" rx="8" fill="#FFE4D6" stroke="#878278"/><text x="510" y="213" font-size="21">等待 / 计算</text><text x="510" y="249" font-size="19">成功或失败</text><rect x="45" y="183" width="250" height="85" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="170" y="216" font-size="20">继续处理输入</text><text x="170" y="244" font-size="18">布局、绘制、窗口事件</text><path d="M510 284V310H170m9 -5l-9 5 9 5" fill="none" stroke="#A8532D" stroke-width="2"/><text x="340" y="300" font-size="17">提交结果</text><rect x="45" y="337" width="250" height="48" rx="8" fill="#FFE4D6" stroke="#878278"/><text x="170" y="368" font-size="20">更新状态 · 恢复按钮</text><text x="340" y="433" font-size="18">后台工作与 UI 更新分别遵守自己的线程规则。</text></g></svg>