<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 570" role="img" aria-labelledby="t d"><title id="t">闭包与词法绑定</title><desc id="d">make-adder 的每次调用建立独立的 n 绑定；返回的函数引用该绑定；add10 5 返回15。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs><rect width="680" height="570" rx="16" fill="#f8fafc"/><g font-family="sans-serif" fill="#172554"><text x="340" y="40" text-anchor="middle" font-size="26" font-weight="bold">闭包：函数与它引用的绑定</text><text x="340" y="80" text-anchor="middle" font-size="22" font-weight="bold">① 调用 (make-adder 10)</text><rect x="65" y="100" width="550" height="92" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="340" y="133" text-anchor="middle" font-size="21">外层调用：n 绑定到 10</text><text x="340" y="167" text-anchor="middle" font-size="24">(lambda (x) (+ x n))</text><path d="M340 192V223" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="340" y="247" text-anchor="middle" font-size="22" font-weight="bold">② 返回函数 add10</text><rect x="40" y="268" width="275" height="95" rx="8" fill="#dbeafe" stroke="#64748b" stroke-width="1.5"/><text x="177" y="302" text-anchor="middle" font-size="18" font-weight="bold">函数体</text><text x="177" y="337" text-anchor="middle" font-size="24">(+ x n)</text><rect x="400" y="268" width="240" height="95" rx="8" fill="#ccfbf1" stroke="#64748b" stroke-width="1.5"/><text x="520" y="302" text-anchor="middle" font-size="18" font-weight="bold">外层绑定</text><text x="520" y="337" text-anchor="middle" font-size="24">n → 10</text><path d="M315 316H396" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="357" y="299" text-anchor="middle" font-size="16">引用</text><path d="M177 363V399" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="340" y="423" text-anchor="middle" font-size="22" font-weight="bold">③ 调用 (add10 5)</text><rect x="40" y="443" width="600" height="78" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="340" y="474" text-anchor="middle" font-size="21">新参数 x = 5；原绑定 n = 10</text><text x="340" y="504" text-anchor="middle" font-size="24" font-weight="bold">(+ 5 10) → 15</text><text x="340" y="550" text-anchor="middle" font-size="19">捕获的是词法绑定，不是必然复制变量的值。</text></g></svg>