<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 570" role="img" aria-labelledby="t d"><title id="t">从开发到发行的工程流程</title><desc id="d">链接源码、运行测试、构建可执行入口并收集依赖，最后进行目标环境验收。</desc><rect width="680" height="570" rx="12" fill="#FAF9F6"/><g font-family="Inter, PingFang SC, Microsoft YaHei, system-ui, sans-serif" text-anchor="middle" fill="#2A2820"><text x="340" y="38" font-size="24" font-weight="bold">从开发到发行的工程流程</text><rect x="40" y="65" width="600" height="92" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="340" y="98" font-size="22" font-weight="bold">开发源码</text><text x="340" y="130" font-size="19">raco pkg install --link .</text><path d="M340 157v21m-5 -8l5 8 5 -8" stroke="#A8532D" stroke-width="2" fill="none"/><rect x="40" y="183" width="600" height="92" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="340" y="216" font-size="22" font-weight="bold">测试与编译</text><text x="340" y="248" font-size="19">raco test . · raco make main.rkt</text><path d="M340 275v21m-5 -8l5 8 5 -8" stroke="#A8532D" stroke-width="2" fill="none"/><rect x="40" y="301" width="600" height="92" rx="8" fill="#FFE4D6" stroke="#878278"/><text x="340" y="334" font-size="22" font-weight="bold">构建发行目录</text><text x="340" y="366" font-size="19">raco exe · raco distribute</text><path d="M340 393v21m-5 -8l5 8 5 -8" stroke="#A8532D" stroke-width="2" fill="none"/><rect x="40" y="419" width="600" height="92" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="340" y="452" font-size="22" font-weight="bold">目标环境验收</text><text x="340" y="484" font-size="19">检查安装、启动、依赖与实际功能</text></g></svg>