<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" role="img" aria-labelledby="t d"><title id="t">MiniDraw：从指令到执行</title><desc id="d">命令数据由 match 分派并打印动作。</desc><rect width="680" height="480" rx="12" fill="#FAF9F6"/><g font-family="Inter, PingFang SC, Microsoft YaHei, system-ui, sans-serif" text-anchor="middle" fill="#2A2820"><text x="340" y="38" font-size="24" font-weight="bold">MiniDraw：从指令到执行</text><rect x="35" y="65" width="610" height="98" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="340" y="98" font-size="22" font-weight="bold">命令数据</text><text x="340" y="132" font-size="19">'(draw (move 10 10) (line-to 100 10))</text><path d="M340 163v23m-5 -8l5 8 5 -8" fill="none" stroke="#A8532D" stroke-width="2"/><rect x="35" y="192" width="610" height="98" rx="8" fill="#FFE4D6" stroke="#878278"/><text x="340" y="225" font-size="22" font-weight="bold">解释器 eval-draw / eval-command</text><text x="340" y="259" font-size="19">match 识别命令形状，绑定坐标</text><path d="M340 290v23m-5 -8l5 8 5 -8" fill="none" stroke="#A8532D" stroke-width="2"/><rect x="35" y="319" width="610" height="98" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="340" y="352" font-size="22" font-weight="bold">执行动作</text><text x="340" y="386" font-size="19">Move to (10, 10) · Line to (100, 10)</text></g></svg>