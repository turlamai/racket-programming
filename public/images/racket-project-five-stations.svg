<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 610" role="img" aria-labelledby="t d"><title id="t">Racket 工程的五个阶段</title><desc id="d">探索、组织、验证、构建、交付五个阶段，可根据反馈重复迭代。</desc><rect width="680" height="610" rx="12" fill="#FAF9F6"/><g font-family="Inter, PingFang SC, Microsoft YaHei, system-ui, sans-serif" text-anchor="middle" fill="#2A2820"><text x="340" y="38" font-size="24" font-weight="bold">Racket 工程的五个阶段</text><rect x="40" y="65" width="560" height="80" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="320" y="95" font-size="22" font-weight="bold">1 · 探索</text><text x="320" y="122" font-size="19">REPL · 小型实验</text><path d="M320 145v23m-5 -8l5 8 5 -8" stroke="#A8532D" stroke-width="2" fill="none"/><rect x="40" y="168" width="560" height="80" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="320" y="198" font-size="22" font-weight="bold">2 · 组织</text><text x="320" y="225" font-size="19">模块 · 包与依赖</text><path d="M320 248v23m-5 -8l5 8 5 -8" stroke="#A8532D" stroke-width="2" fill="none"/><rect x="40" y="271" width="560" height="80" rx="8" fill="#FFE4D6" stroke="#878278"/><text x="320" y="301" font-size="22" font-weight="bold">3 · 验证</text><text x="320" y="328" font-size="19">RackUnit · 契约 · CI</text><path d="M320 351v23m-5 -8l5 8 5 -8" stroke="#A8532D" stroke-width="2" fill="none"/><rect x="40" y="374" width="560" height="80" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="320" y="404" font-size="22" font-weight="bold">4 · 构建</text><text x="320" y="431" font-size="19">raco exe / distribute 或框架构建</text><path d="M320 454v23m-5 -8l5 8 5 -8" stroke="#A8532D" stroke-width="2" fill="none"/><rect x="40" y="477" width="560" height="80" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="320" y="507" font-size="22" font-weight="bold">5 · 交付</text><text x="320" y="534" font-size="19">目标环境验收 · 发布 · 反馈</text><path d="M600 517H638V105H600m8 -5l-8 5 8 5" stroke="#A8532D" stroke-width="2" stroke-dasharray="6 4" fill="none"/><text x="340" y="586" font-size="18">反馈可以推动任一阶段重新迭代。</text></g></svg>