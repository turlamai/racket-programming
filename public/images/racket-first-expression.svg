<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" role="img" aria-labelledby="t d"><title id="t">嵌套表达式的计算过程</title><desc id="d">乘法表达式包含一个加法表达式，先得到三，再相乘得到九。</desc><rect width="680" height="420" rx="12" fill="#FAF9F6"/><g font-family="Inter, PingFang SC, Microsoft YaHei, system-ui,sans-serif" text-anchor="middle" fill="#2A2820"><text x="340" y="40" font-size="24" font-weight="bold">从内层计算到外层结果</text><rect x="40" y="65" width="600" height="78" rx="8" fill="#F5F3EE" stroke="#C8C3B8"/><text x="340" y="113" font-family="monospace" font-size="28">(* (+ 1 2) 3)</text><path d="M340 143v30m-6 -8l6 8 6 -8" stroke="#A8532D" stroke-width="2" fill="none"/><rect x="40" y="174" width="600" height="95" rx="8" fill="#FFE4D6" stroke="#A8532D"/><text x="340" y="208" font-size="20">内层加法得到 3</text><text x="340" y="246" font-family="monospace" font-size="28">(* 3 3)</text><path d="M340 269v30m-6 -8l6 8 6 -8" stroke="#A8532D" stroke-width="2" fill="none"/><rect x="40" y="300" width="600" height="84" rx="8" fill="#F5F3EE" stroke="#C8C3B8"/><text x="340" y="333" font-size="20">外层乘法得到结果</text><text x="340" y="366" font-size="26" font-weight="bold">9</text></g></svg>