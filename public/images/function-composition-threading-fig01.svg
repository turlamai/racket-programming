<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 590" role="img" aria-labelledby="t d"><title id="t">嵌套调用、组合和管道</title><desc id="d">三种写法均先将字符串41转换为数字，再加一，最后转换成字符串42。compose构造函数，管道处理具体值。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6B6760"/></marker></defs><rect width="680" height="590" rx="16" fill="#FAF9F6"/><g font-family="Inter, PingFang SC, Microsoft YaHei, system-ui, sans-serif" fill="#2A2820"><text x="340" y="40" text-anchor="middle" font-size="25" font-weight="bold">三种写法，同一个数据流</text><rect x="30" y="70" width="620" height="92" rx="8" fill="#EBE8E0" stroke="#878278" stroke-width="1.5"/><text x="340" y="93" text-anchor="middle" font-size="19" font-weight="bold">嵌套调用</text><text x="340" y="120" text-anchor="middle" font-size="19">(number-&gt;string</text><text x="340" y="145" text-anchor="middle" font-size="19"> (add1 (string-&gt;number "41")))</text><rect x="30" y="175" width="620" height="92" rx="8" fill="#EBE8E0" stroke="#878278" stroke-width="1.5"/><text x="340" y="198" text-anchor="middle" font-size="19" font-weight="bold">compose：先构造函数再调用</text><text x="340" y="225" text-anchor="middle" font-size="19">(define f (compose number-&gt;string</text><text x="340" y="250" text-anchor="middle" font-size="19"> add1 string-&gt;number))  (f "41")</text><rect x="30" y="280" width="620" height="92" rx="8" fill="#EBE8E0" stroke="#878278" stroke-width="1.5"/><text x="340" y="303" text-anchor="middle" font-size="19" font-weight="bold">管道：直接处理输入</text><text x="340" y="330" text-anchor="middle" font-size="19">(-&gt; "41" string-&gt;number</text><text x="340" y="355" text-anchor="middle" font-size="19"> add1 number-&gt;string)</text><text x="340" y="410" text-anchor="middle" font-size="22" font-weight="bold">实际计算顺序</text><rect x="22" y="460" width="126" height="77" rx="8" fill="#F5F3EE" stroke="#878278" stroke-width="1.5"/><text x="85" y="490" text-anchor="middle" font-size="24" font-weight="bold">"41"</text><text x="85" y="518" text-anchor="middle" font-size="17">字符串</text><path d="M148 499H189" fill="none" stroke="#6B6760" stroke-width="2" marker-end="url(#a)"/><rect x="192" y="460" width="126" height="77" rx="8" fill="#F5F3EE" stroke="#878278" stroke-width="1.5"/><text x="255" y="490" text-anchor="middle" font-size="24" font-weight="bold">41</text><text x="255" y="518" text-anchor="middle" font-size="17">数字</text><path d="M318 499H359" fill="none" stroke="#6B6760" stroke-width="2" marker-end="url(#a)"/><rect x="362" y="460" width="126" height="77" rx="8" fill="#F5F3EE" stroke="#878278" stroke-width="1.5"/><text x="425" y="490" text-anchor="middle" font-size="24" font-weight="bold">42</text><text x="425" y="518" text-anchor="middle" font-size="17">数字</text><path d="M488 499H529" fill="none" stroke="#6B6760" stroke-width="2" marker-end="url(#a)"/><rect x="532" y="460" width="126" height="77" rx="8" fill="#FFE4D6" stroke="#878278" stroke-width="1.5"/><text x="595" y="490" text-anchor="middle" font-size="24" font-weight="bold">"42"</text><text x="595" y="518" text-anchor="middle" font-size="17">字符串</text><text x="170" y="449" text-anchor="middle" font-size="17">解析</text><text x="340" y="449" text-anchor="middle" font-size="17">加一</text><text x="510" y="449" text-anchor="middle" font-size="17">转字符串</text><text x="340" y="568" text-anchor="middle" font-size="19">写法不同，不代表计算顺序不同。</text></g></svg>