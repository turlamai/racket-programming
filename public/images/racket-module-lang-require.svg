<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 590" role="img" aria-labelledby="t d"><title id="t">#lang require provide</title><desc id="d">#lang 选择读取器及模块语言；require 导入导出绑定；provide 指定其他模块可以导入的绑定。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#A8532D"/></marker></defs><rect width="680" height="590" rx="12" fill="#FAF9F6"/><g font-family="Inter, PingFang SC, Microsoft YaHei, system-ui, sans-serif" fill="#2A2820"><text x="340" y="40" text-anchor="middle" font-size="25" font-weight="bold">模块机制的三个入口</text><rect x="30" y="70" width="620" height="90" rx="8" fill="#FFE4D6" stroke="#878278" stroke-width="1.5"/><text x="340" y="100" text-anchor="middle" font-size="23" font-weight="bold">① #lang racket</text><text x="340" y="132" text-anchor="middle" font-size="20">选择读取方式与模块语言</text><path d="M340 160V195" fill="none" stroke="#A8532D" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="200" width="620" height="172" rx="8" fill="#F5F3EE" stroke="#878278" stroke-width="1.5"/><text x="340" y="230" text-anchor="middle" font-size="22" font-weight="bold">math-tools.rkt</text><text x="340" y="264" text-anchor="middle" font-size="22">(require racket/list)</text><text x="340" y="293" text-anchor="middle" font-size="18">② 导入其他模块的绑定</text><text x="340" y="326" text-anchor="middle" font-size="22">(provide square)</text><text x="340" y="352" text-anchor="middle" font-size="18">③ 指定本模块导出的绑定</text><path d="M340 372V412" fill="none" stroke="#A8532D" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="417" width="620" height="107" rx="8" fill="#EBE8E0" stroke="#878278" stroke-width="1.5"/><text x="340" y="446" text-anchor="middle" font-size="22" font-weight="bold">main.rkt</text><text x="340" y="476" text-anchor="middle" font-size="22">(require "math-tools.rkt")</text><text x="340" y="504" text-anchor="middle" font-size="22">(square 5) → 25</text><text x="340" y="565" text-anchor="middle" font-size="19">未导出的 helper 不会通过普通 require 导入。</text></g></svg>