<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 570" role="img" aria-labelledby="t d"><title id="t">HTTP：从请求到响应</title><desc id="d">浏览器发出请求，服务器解析请求，处理函数返回响应描述，服务器发送状态、头与正文。</desc><rect width="680" height="570" rx="12" fill="#FAF9F6"/><g font-family="Inter, PingFang SC, Microsoft YaHei, system-ui, sans-serif" text-anchor="middle" fill="#2A2820"><text x="340" y="38" font-size="24" font-weight="bold">HTTP：从请求到响应</text><rect x="40" y="65" width="600" height="92" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="340" y="97" font-size="22" font-weight="bold">浏览器请求</text><text x="340" y="130" font-size="19">GET / · 请求头 · 可选请求体</text><path d="M340 157v21m-5 -8l5 8 5 -8" stroke="#A8532D" stroke-width="2" fill="none"/><rect x="40" y="183" width="600" height="92" rx="8" fill="#FFE4D6" stroke="#878278"/><text x="340" y="215" font-size="22" font-weight="bold">Racket Web Server</text><text x="340" y="248" font-size="19">解析请求并分派给处理函数</text><path d="M340 275v21m-5 -8l5 8 5 -8" stroke="#A8532D" stroke-width="2" fill="none"/><rect x="40" y="301" width="600" height="92" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="340" y="333" font-size="22" font-weight="bold">处理函数</text><text x="340" y="366" font-size="19">返回 response：状态码、响应头、响应体</text><path d="M340 393v21m-5 -8l5 8 5 -8" stroke="#A8532D" stroke-width="2" fill="none"/><rect x="40" y="419" width="600" height="92" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="340" y="451" font-size="22" font-weight="bold">浏览器</text><text x="340" y="484" font-size="19">接收响应并按内容类型处理</text></g></svg>