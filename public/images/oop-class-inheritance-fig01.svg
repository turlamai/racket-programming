<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" role="img" aria-labelledby="t d"><title id="t">类、对象与继承</title><desc id="d">person% 定义字段及方法，两个实例各有状态；student% 继承 person% 并可覆盖 info。</desc><rect width="680" height="480" rx="12" fill="#FAF9F6"/><g font-family="Inter, PingFang SC, Microsoft YaHei, system-ui, sans-serif" text-anchor="middle" fill="#2A2820"><text x="340" y="38" font-size="24" font-weight="bold">类定义行为，实例保存各自状态</text><rect x="180" y="65" width="320" height="80" rx="8" fill="#FFE4D6" stroke="#878278"/><text x="340" y="96" font-size="23" font-weight="bold">person%</text><text x="340" y="126" font-size="20">name · age · info</text><path d="M340 145V175H120V200 M340 175H340V200 M340 175H560V200" fill="none" stroke="#A8532D" stroke-width="2"/><rect x="20" y="200" width="200" height="90" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="120" y="233" font-size="21" font-weight="bold">p1 实例</text><text x="120" y="264" font-size="18">Alice · 18</text><rect x="240" y="200" width="200" height="90" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="340" y="233" font-size="21" font-weight="bold">p2 实例</text><text x="340" y="264" font-size="18">Bob · 30</text><rect x="460" y="200" width="200" height="90" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="560" y="233" font-size="21" font-weight="bold">student% 子类</text><text x="560" y="264" font-size="18">继承并覆盖 info</text><path d="M560 290V324m-5 -8l5 8 5 -8" fill="none" stroke="#A8532D" stroke-width="2"/><rect x="460" y="330" width="200" height="70" rx="8" fill="#FFE4D6" stroke="#878278"/><text x="560" y="357" font-size="20" font-weight="bold">student 实例</text><text x="560" y="383" font-size="19">Dave · 22</text><text x="225" y="356" font-size="20" font-weight="bold">两个对象的字段独立</text><text x="225" y="384" font-size="18">修改 p1 不会自动修改 p2</text><text x="340" y="451" font-size="18">箭头表示创建或继承关系，不表示内存布局。</text></g></svg>