<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 680" role="img" aria-labelledby="t d"><title id="t">map filter foldl</title><desc id="d">map 对每个值加一，filter 保留偶数，foldl 从初值0逐次累加。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6B6760"/></marker></defs><rect width="680" height="680" rx="16" fill="#FAF9F6"/><g font-family="Inter, PingFang SC, Microsoft YaHei, system-ui, sans-serif" fill="#2A2820"><text x="340" y="40" text-anchor="middle" font-size="26" font-weight="bold">三种列表处理方式</text><text x="340" y="80" text-anchor="middle" font-size="22" font-weight="bold">① map：逐元素转换</text><rect x="63" y="100" width="70" height="46" rx="8" fill="#EBE8E0" stroke="#878278" stroke-width="1.5"/><text x="98" y="130" text-anchor="middle" font-size="23">1</text><path d="M98 146V181" fill="none" stroke="#6B6760" stroke-width="2" marker-end="url(#a)"/><text x="136" y="169" text-anchor="middle" font-size="16">+1</text><rect x="63" y="185" width="70" height="46" rx="8" fill="#FFE4D6" stroke="#878278" stroke-width="1.5"/><text x="98" y="215" text-anchor="middle" font-size="23">2</text><rect x="199" y="100" width="70" height="46" rx="8" fill="#EBE8E0" stroke="#878278" stroke-width="1.5"/><text x="234" y="130" text-anchor="middle" font-size="23">2</text><path d="M234 146V181" fill="none" stroke="#6B6760" stroke-width="2" marker-end="url(#a)"/><text x="272" y="169" text-anchor="middle" font-size="16">+1</text><rect x="199" y="185" width="70" height="46" rx="8" fill="#FFE4D6" stroke="#878278" stroke-width="1.5"/><text x="234" y="215" text-anchor="middle" font-size="23">3</text><rect x="335" y="100" width="70" height="46" rx="8" fill="#EBE8E0" stroke="#878278" stroke-width="1.5"/><text x="370" y="130" text-anchor="middle" font-size="23">3</text><path d="M370 146V181" fill="none" stroke="#6B6760" stroke-width="2" marker-end="url(#a)"/><text x="408" y="169" text-anchor="middle" font-size="16">+1</text><rect x="335" y="185" width="70" height="46" rx="8" fill="#FFE4D6" stroke="#878278" stroke-width="1.5"/><text x="370" y="215" text-anchor="middle" font-size="23">4</text><rect x="471" y="100" width="70" height="46" rx="8" fill="#EBE8E0" stroke="#878278" stroke-width="1.5"/><text x="506" y="130" text-anchor="middle" font-size="23">4</text><path d="M506 146V181" fill="none" stroke="#6B6760" stroke-width="2" marker-end="url(#a)"/><text x="544" y="169" text-anchor="middle" font-size="16">+1</text><rect x="471" y="185" width="70" height="46" rx="8" fill="#FFE4D6" stroke="#878278" stroke-width="1.5"/><text x="506" y="215" text-anchor="middle" font-size="23">5</text><text x="340" y="257" text-anchor="middle" font-size="19">(map add1 '(1 2 3 4)) → '(2 3 4 5)</text><text x="340" y="301" text-anchor="middle" font-size="22" font-weight="bold">② filter：保留满足条件的元素</text><rect x="63" y="320" width="70" height="46" rx="8" fill="#EBE8E0" stroke="#878278" stroke-width="1.5"/><text x="98" y="350" text-anchor="middle" font-size="23">1</text><text x="98" y="391" text-anchor="middle" font-size="17">#f 跳过</text><rect x="199" y="320" width="70" height="46" rx="8" fill="#EBE8E0" stroke="#878278" stroke-width="1.5"/><text x="234" y="350" text-anchor="middle" font-size="23">2</text><text x="234" y="391" text-anchor="middle" font-size="17">#t 保留</text><path d="M234 399V420" fill="none" stroke="#6B6760" stroke-width="2" marker-end="url(#a)"/><rect x="199" y="424" width="70" height="46" rx="8" fill="#FFE4D6" stroke="#878278" stroke-width="1.5"/><text x="234" y="454" text-anchor="middle" font-size="23">2</text><rect x="335" y="320" width="70" height="46" rx="8" fill="#EBE8E0" stroke="#878278" stroke-width="1.5"/><text x="370" y="350" text-anchor="middle" font-size="23">3</text><text x="370" y="391" text-anchor="middle" font-size="17">#f 跳过</text><rect x="471" y="320" width="70" height="46" rx="8" fill="#EBE8E0" stroke="#878278" stroke-width="1.5"/><text x="506" y="350" text-anchor="middle" font-size="23">4</text><text x="506" y="391" text-anchor="middle" font-size="17">#t 保留</text><path d="M506 399V420" fill="none" stroke="#6B6760" stroke-width="2" marker-end="url(#a)"/><rect x="471" y="424" width="70" height="46" rx="8" fill="#FFE4D6" stroke="#878278" stroke-width="1.5"/><text x="506" y="454" text-anchor="middle" font-size="23">4</text><text x="340" y="495" text-anchor="middle" font-size="19">(filter even? '(1 2 3 4)) → '(2 4)</text><text x="340" y="538" text-anchor="middle" font-size="22" font-weight="bold">③ foldl：从初始值累积结果</text><rect x="38" y="564" width="60" height="48" rx="8" fill="#EBE8E0" stroke="#878278" stroke-width="1.5"/><text x="68" y="595" text-anchor="middle" font-size="23">0</text><path d="M98 588H170" fill="none" stroke="#6B6760" stroke-width="2" marker-end="url(#a)"/><text x="136" y="576" text-anchor="middle" font-size="16">+1</text><rect x="174" y="564" width="60" height="48" rx="8" fill="#EBE8E0" stroke="#878278" stroke-width="1.5"/><text x="204" y="595" text-anchor="middle" font-size="23">1</text><path d="M234 588H306" fill="none" stroke="#6B6760" stroke-width="2" marker-end="url(#a)"/><text x="272" y="576" text-anchor="middle" font-size="16">+2</text><rect x="310" y="564" width="60" height="48" rx="8" fill="#EBE8E0" stroke="#878278" stroke-width="1.5"/><text x="340" y="595" text-anchor="middle" font-size="23">3</text><path d="M370 588H442" fill="none" stroke="#6B6760" stroke-width="2" marker-end="url(#a)"/><text x="408" y="576" text-anchor="middle" font-size="16">+3</text><rect x="446" y="564" width="60" height="48" rx="8" fill="#EBE8E0" stroke="#878278" stroke-width="1.5"/><text x="476" y="595" text-anchor="middle" font-size="23">6</text><path d="M506 588H578" fill="none" stroke="#6B6760" stroke-width="2" marker-end="url(#a)"/><text x="544" y="576" text-anchor="middle" font-size="16">+4</text><rect x="582" y="564" width="60" height="48" rx="8" fill="#FFE4D6" stroke="#878278" stroke-width="1.5"/><text x="612" y="595" text-anchor="middle" font-size="23">10</text><text x="340" y="646" text-anchor="middle" font-size="19">(foldl + 0 '(1 2 3 4)) → 10</text></g></svg>