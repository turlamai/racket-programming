<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 650" role="img" aria-labelledby="t d"><title id="t">Racket 常见数据的学习地图</title><desc id="d">数字、字符串、布尔值、符号和字符；点对和列表；向量、哈希表、结构体等其他组合数据。不是所有运行时值的穷尽分类。</desc><rect width="680" height="650" rx="12" fill="#FAF9F6"/><g font-family="Inter, PingFang SC, Microsoft YaHei, system-ui, sans-serif" text-anchor="middle" fill="#2A2820"><text x="340" y="40" font-size="25" font-weight="bold">Racket：认识数据，再组合数据</text><text x="340" y="78" font-size="21" font-weight="bold">常见简单值</text><rect x="25" y="95" width="305" height="65" rx="8" fill="#F5F3EE" stroke="#878278" stroke-width="1.4"/><text x="177.5" y="120" font-size="19" font-weight="bold">数 · number?</text><text x="177.5" y="145" font-size="19">42 · 1/2 · 3.14</text><rect x="350" y="95" width="305" height="65" rx="8" fill="#F5F3EE" stroke="#878278" stroke-width="1.4"/><text x="502.5" y="120" font-size="19" font-weight="bold">字符串 · string?</text><text x="502.5" y="145" font-size="19">&quot;hello&quot;</text><rect x="25" y="172" width="305" height="65" rx="8" fill="#F5F3EE" stroke="#878278" stroke-width="1.4"/><text x="177.5" y="197" font-size="19" font-weight="bold">布尔 · boolean?</text><text x="177.5" y="222" font-size="19">#t · #f</text><rect x="350" y="172" width="305" height="65" rx="8" fill="#F5F3EE" stroke="#878278" stroke-width="1.4"/><text x="502.5" y="197" font-size="19" font-weight="bold">符号 · symbol?</text><text x="502.5" y="222" font-size="19">'red</text><rect x="25" y="249" width="305" height="65" rx="8" fill="#F5F3EE" stroke="#878278" stroke-width="1.4"/><text x="177.5" y="274" font-size="19" font-weight="bold">字符 · char?</text><text x="177.5" y="299" font-size="19">#\a</text><text x="340" y="346" font-size="21" font-weight="bold">本章重点：点对与列表</text><rect x="25" y="364" width="305" height="81" rx="8" fill="#FFE4D6" stroke="#878278" stroke-width="1.4"/><text x="177" y="395" font-size="21" font-weight="bold">点对 · pair?</text><text x="177" y="423" font-size="18">(cons 1 2) → '(1 . 2)</text><rect x="350" y="364" width="305" height="81" rx="8" fill="#FFE4D6" stroke="#878278" stroke-width="1.4"/><text x="502" y="395" font-size="21" font-weight="bold">列表 · list?</text><text x="502" y="423" font-size="18">(list 1 2) → '(1 2)</text><text x="340" y="476" font-size="18">正规列表：空列表，或 cdr 为正规列表的点对。</text><rect x="25" y="500" width="630" height="86" rx="8" fill="#F5F3EE" stroke="#878278" stroke-width="1.4"/><text x="340" y="530" font-size="21" font-weight="bold">其他组合数据</text><text x="340" y="559" font-size="20">向量 · 哈希表 · 结构体</text><text x="340" y="623" font-size="18">教学分类，并非全部 Racket 值的类型体系。</text></g></svg>