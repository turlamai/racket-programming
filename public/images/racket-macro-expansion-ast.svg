<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 650" role="img" aria-labelledby="t d"><title id="t">宏展开与运行阶段</title><desc id="d">my-> 宏逐步重写语法，直到基础规则返回嵌套调用；运行阶段才调用函数。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs><rect width="680" height="650" rx="16" fill="#f8fafc"/><g font-family="sans-serif" fill="#172554"><text x="340" y="40" text-anchor="middle" font-size="25" font-weight="bold">宏展开：先改写，再执行</text><text x="340" y="77" text-anchor="middle" font-size="21" font-weight="bold">展开阶段（不执行 f、g、h）</text><rect x="85" y="94" width="510" height="52" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="340" y="127" text-anchor="middle" font-size="23">(my-&gt; x f g h)</text><path d="M340 146V171" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="85" y="173" width="510" height="52" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="340" y="206" text-anchor="middle" font-size="23">(my-&gt; (f x) g h)</text><path d="M340 225V250" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="85" y="252" width="510" height="52" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="340" y="285" text-anchor="middle" font-size="23">(my-&gt; (g (f x)) h)</text><path d="M340 304V329" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="85" y="331" width="510" height="52" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="340" y="364" text-anchor="middle" font-size="23">(my-&gt; (h (g (f x))))</text><path d="M340 383V408" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="85" y="410" width="510" height="52" rx="8" fill="#ccfbf1" stroke="#64748b" stroke-width="1.5"/><text x="340" y="443" text-anchor="middle" font-size="23">(h (g (f x)))</text><path d="M30 502H650" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5"/><text x="340" y="535" text-anchor="middle" font-size="21" font-weight="bold">运行阶段</text><rect x="45" y="553" width="590" height="55" rx="8" fill="#dbeafe" stroke="#64748b" stroke-width="1.5"/><text x="340" y="588" text-anchor="middle" font-size="24">x → f → g → h → 结果</text><text x="340" y="632" text-anchor="middle" font-size="17">图中省略更底层的核心语法展开。</text></g></svg>