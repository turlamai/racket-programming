<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" role="img" aria-labelledby="t d"><title id="t">应用中的四类状态问题</title><desc id="d">纯计算、局部状态、交互界面与网络会话是四种可组合的问题视角，并非必须逐级升级。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#A8532D"/></marker></defs><rect width="680" height="560" rx="12" fill="#FAF9F6"/><g font-family="Inter, PingFang SC, Microsoft YaHei, system-ui, sans-serif" fill="#2A2820"><text x="340" y="40" text-anchor="middle" font-size="24" font-weight="bold">从计算到应用：四种问题视角</text><rect x="30" y="70" width="620" height="88" rx="8" fill="#F5F3EE" stroke="#878278" stroke-width="1.5"/><text x="115" y="104" text-anchor="middle" font-size="18" font-weight="bold">卷三</text><text x="390" y="101" text-anchor="middle" font-size="22" font-weight="bold">纯计算</text><text x="390" y="131" text-anchor="middle" font-size="19">输入 → 函数 → 输出</text><rect x="30" y="173" width="620" height="88" rx="8" fill="#F5F3EE" stroke="#878278" stroke-width="1.5"/><text x="115" y="207" text-anchor="middle" font-size="18" font-weight="bold">卷四</text><text x="390" y="204" text-anchor="middle" font-size="22" font-weight="bold">局部状态</text><text x="390" y="234" text-anchor="middle" font-size="19">当前状态 + 事件 → 新状态</text><rect x="30" y="276" width="620" height="88" rx="8" fill="#F5F3EE" stroke="#878278" stroke-width="1.5"/><text x="115" y="310" text-anchor="middle" font-size="18" font-weight="bold">卷五</text><text x="390" y="307" text-anchor="middle" font-size="22" font-weight="bold">交互界面</text><text x="390" y="337" text-anchor="middle" font-size="19">用户事件 → 更新状态 → 显示</text><rect x="30" y="379" width="620" height="88" rx="8" fill="#FFE4D6" stroke="#878278" stroke-width="1.5"/><text x="115" y="413" text-anchor="middle" font-size="18" font-weight="bold">卷七</text><text x="390" y="410" text-anchor="middle" font-size="22" font-weight="bold">网络应用</text><text x="390" y="440" text-anchor="middle" font-size="19">HTTP 请求 → 业务逻辑 → 响应</text><text x="340" y="518" text-anchor="middle" font-size="20" font-weight="bold">这些方法可以组合，而不是互相替代。</text><text x="340" y="543" text-anchor="middle" font-size="17">纯函数同样可以用于 GUI 与 Web 的业务逻辑。</text></g></svg>