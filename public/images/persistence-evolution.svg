<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 570" role="img" aria-labelledby="t d"><title id="t">选择适合需求的持久化方式</title><desc id="d">普通文件、SQLite和服务型数据库可按需求并存，不是必经升级路线。</desc><rect width="680" height="570" rx="12" fill="#FAF9F6"/><g font-family="Inter, PingFang SC, Microsoft YaHei, system-ui, sans-serif" text-anchor="middle" fill="#2A2820"><text x="340" y="38" font-size="24" font-weight="bold">选择适合需求的持久化方式</text><rect x="40" y="65" width="600" height="92" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="340" y="97" font-size="22" font-weight="bold">普通文件</text><text x="340" y="130" font-size="19">简单配置、文档、少量结构化数据</text><rect x="40" y="183" width="600" height="92" rx="8" fill="#FFE4D6" stroke="#878278"/><text x="340" y="215" font-size="22" font-weight="bold">SQLite</text><text x="340" y="248" font-size="19">嵌入式 SQL 引擎 · 本地事务与查询</text><rect x="40" y="301" width="600" height="92" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="340" y="333" font-size="22" font-weight="bold">服务型数据库</text><text x="340" y="366" font-size="19">远程连接 · 多客户端 · 独立服务</text><rect x="40" y="419" width="600" height="92" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="340" y="451" font-size="22" font-weight="bold">选择依据</text><text x="340" y="484" font-size="19">查询、并发、备份、部署与维护成本</text></g></svg>