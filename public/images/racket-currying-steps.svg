<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" role="img" aria-labelledby="t d"><title id="t">柯里化：分两次接收参数</title><desc id="d">先调用 add 2，返回捕获 x 的过程，再传入3得到5。</desc><rect width="680" height="470" rx="12" fill="#FAF9F6"/><g font-family="Inter, PingFang SC, Microsoft YaHei, system-ui, sans-serif" text-anchor="middle" fill="#2A2820"><text x="340" y="38" font-size="25" font-weight="bold">柯里化：分两次接收参数</text><rect x="40" y="65" width="600" height="100" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="340" y="100" font-size="22" font-weight="bold">定义 add</text><text x="340" y="135" font-size="21">(lambda (x) (lambda (y) (+ x y)))</text><path d="M340 165v20m-5 -8l5 8 5 -8" fill="none" stroke="#A8532D" stroke-width="2"/><rect x="40" y="190" width="600" height="100" rx="8" fill="#FFE4D6" stroke="#878278"/><text x="340" y="225" font-size="22" font-weight="bold">第一次调用：绑定 x = 2</text><text x="340" y="260" font-size="21">(add 2) → 一个等待 y 的过程</text><path d="M340 290v20m-5 -8l5 8 5 -8" fill="none" stroke="#A8532D" stroke-width="2"/><rect x="40" y="315" width="600" height="100" rx="8" fill="#F5F3EE" stroke="#878278"/><text x="340" y="350" font-size="22" font-weight="bold">第二次调用：绑定 y = 3</text><text x="340" y="385" font-size="21">((add 2) 3) → 5</text></g></svg>