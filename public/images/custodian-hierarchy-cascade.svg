<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 530" role="img" aria-labelledby="t d"><title id="t">Custodian 的资源归属与关闭范围</title><desc id="d">父管家管理两个子管家，分别管理线程与端口。关闭父管家将关闭子管家及受管理的资源。共享资源的生命周期须考虑其他管理者。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#A8532D"/></marker></defs><rect width="680" height="530" rx="12" fill="#FAF9F6"/><g font-family="Inter, PingFang SC, Microsoft YaHei, system-ui, sans-serif" fill="#2A2820"><text x="340" y="40" text-anchor="middle" font-size="25" font-weight="bold">Custodian：按归属管理资源</text><rect x="145" y="70" width="390" height="65" rx="8" fill="#FFE4D6" stroke="#878278" stroke-width="1.5"/><text x="340" y="95" text-anchor="middle" font-size="22" font-weight="bold">父管家 root</text><text x="340" y="120" text-anchor="middle" font-size="18">custodian-shutdown-all</text><path d="M340 135V163H170V190" fill="none" stroke="#A8532D" stroke-width="2" marker-end="url(#a)"/><path d="M340 163H510V190" fill="none" stroke="#A8532D" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="195" width="280" height="64" rx="8" fill="#F5F3EE" stroke="#878278" stroke-width="1.5"/><text x="170" y="234" text-anchor="middle" font-size="22">子管家 child-a</text><rect x="370" y="195" width="280" height="64" rx="8" fill="#F5F3EE" stroke="#878278" stroke-width="1.5"/><text x="510" y="234" text-anchor="middle" font-size="22">子管家 child-b</text><path d="M170 259V285H95V312" fill="none" stroke="#A8532D" stroke-width="2" marker-end="url(#a)"/><path d="M170 285H245V312" fill="none" stroke="#A8532D" stroke-width="2" marker-end="url(#a)"/><path d="M510 259V285H435V312" fill="none" stroke="#A8532D" stroke-width="2" marker-end="url(#a)"/><path d="M510 285H585V312" fill="none" stroke="#A8532D" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="317" width="130" height="60" rx="8" fill="#EBE8E0" stroke="#878278" stroke-width="1.5"/><text x="95" y="354" text-anchor="middle" font-size="18">TCP 监听器</text><rect x="180" y="317" width="130" height="60" rx="8" fill="#EBE8E0" stroke="#878278" stroke-width="1.5"/><text x="245" y="354" text-anchor="middle" font-size="18">工作线程</text><rect x="370" y="317" width="130" height="60" rx="8" fill="#EBE8E0" stroke="#878278" stroke-width="1.5"/><text x="435" y="354" text-anchor="middle" font-size="18">文件端口</text><rect x="520" y="317" width="130" height="60" rx="8" fill="#EBE8E0" stroke="#878278" stroke-width="1.5"/><text x="585" y="354" text-anchor="middle" font-size="18">工作线程</text><rect x="30" y="408" width="620" height="98" rx="8" fill="#FFE4D6" stroke="#878278" stroke-width="1.5"/><text x="340" y="438" text-anchor="middle" font-size="22" font-weight="bold">关闭范围：root 及其后代</text><text x="340" y="466" text-anchor="middle" font-size="17">关闭受管理的端口，终止不再有其他管理者的线程</text><text x="340" y="490" text-anchor="middle" font-size="17">强制关停不等于正常退出或业务数据已保存。</text></g></svg>