name: Pollen publishing pilot
on:
  push:
    branches: [pollen-pilot]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pollen-pilot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Racket
        run: sudo apt-get update && sudo apt-get install -y racket
      - name: Install Pollen
        run: raco pkg install --auto --batch pollen
      - name: Stage original routes
        run: |
          racket pollen-pilot/stage.rkt
          test -s pollen-pilot/chapters.js
          test "$(find pollen-pilot/book -name '*.pmd' | wc -l)" -eq 64
          test -s pollen-pilot/book/preface/index.html.pmd
          test -s pollen-pilot/book/part-7/chapter/60/index.html.pmd
      - name: Render all book chapters
        working-directory: pollen-pilot
        run: |
          set -euo pipefail
          while IFS= read -r -d '' source; do
            raco pollen render "$source"
            test -s "${source%.pmd}"
          done < <(find book -name '*.html.pmd' -print0)
          test "$(find book -name index.html | wc -l)" -eq 64
          test -s index.html
      - name: Copy existing public assets
        run: cp -a public/. pollen-pilot/
      - uses: actions/upload-artifact@v4
        with:
          name: pollen-book-preview
          path: |
            pollen-pilot/book/**/index.html
            pollen-pilot/chapters.js
            pollen-pilot/index.html
            pollen-pilot/style.css
            pollen-pilot/images/
