name: Verify book

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Racket 9.3
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: '9.3'

      - name: Install site dependencies
        run: npm ci

      - name: Resolve security update candidate (diagnostic)
        if: github.event_name == 'pull_request'
        run: |
          tmp=$(mktemp -d)
          cp package.json package-lock.json "$tmp/"
          cd "$tmp"
          npm install --package-lock-only --ignore-scripts --save-exact next@16.4.6
          node -e 'const l=require("./package-lock.json"); console.log("NEXT_LOCK_CANDIDATE="+JSON.stringify(Object.fromEntries(Object.entries(l.packages).filter(([k])=>k==="node_modules/next"||k.startsWith("node_modules/@next/")))));'
          npm audit --audit-level=low
        continue-on-error: true

      - name: Check content metadata and links
        run: npm run check:content

      - name: Parse every Racket code block
        run: npm run check:racket

      - name: Run Web examples smoke test
        run: racket tests/web-smoke.rkt

      - name: Run FFI memory smoke test
        run: racket tests/ffi-smoke.rkt

      - name: Type-check site
        run: npm run typecheck

      - name: Build static site
        run: npm run build

      - name: Audit npm dependencies
        if: always()
        run: npm audit --audit-level=low
